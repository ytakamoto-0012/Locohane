id: recipe_images_to_md_end_to_end_large
target: system_prompt_scale
work_dir: evals/fixtures/レシピ
timeout_seconds: 21600
auto_approve: true
turns:
  - >-
    imagesフォルダ内の画像ファイルは料理本のレシピの写真です。
    これらの写真の内容を読み取り、mdフォルダにmdファイルでレシピの内容を
    書き出してください。

    出力ファイル名 ${元画像ファイル名}-${料理名}-${材料}.md

    材料は材料の名前を _ アンダーバーでつなぐ。ファイル名に使用できない文字は除外する。

    出力フォーマット

    # 料理名

    関連画像ファイル名： ${ファイル名}

    ## 材料
    画像に記載の材料をここに記載
    分量まで正確に書く

    ## 作り方
    ここに作り方を記述
expect:
  tool_called_any: [dispatch_agent, execute_python_code]
  tool_not_called: [analyze_image]
  tool_call_args_contains:
    dispatch_agent: {agent_type: "explore"}
  response_not_contains: ["申し訳ありません", "できません", "機能がありません"]
judge: |
  images フォルダに297枚の実写真（jpg/png/heic混在）が入った最大規模の
  end-to-end検証ケース。system_prompt.md「サブエージェントへの委任件数に
  ついて」節（2026-07-31修正: 分割件数の目安を${subagent_max_iterations}件
  ベースに一本化し、「グループ数=ceil(合計件数÷目安値)を一度だけ計算して
  以後再計算しない」手順を明記、「同時３つまで」という無関係な並列数制約を
  削除）が、実際に大量ファイル処理での再計算ループを防げているかを検証する
  回帰ケース。

  以下を確認せよ:
  1. 画像の内容確認は必ず dispatch_agent(agent_type="explore") への委譲経由で
     行われているか（main agent が analyze_image を直接呼んで中身を確認して
     いたら、その時点で明確に不合格）。
  2. 分割の粒度が妥当か。全297件を1回のdispatch_agentに丸投げしていないか、
     逆に1件ずつ297回に分割するような過度に細かい分割になっていないか。
     目安（${subagent_max_iterations}件の概ね8割程度=24件前後を1グループの
     目安とし、グループ数=ceil(297÷24)≒13グループ前後）から大きく外れて
     いないか、常識的な範囲かを確認せよ（厳密な一致は不要、明らかに
     不合理な分割でなければよい）。
  3. **最重要**: 分割方法（グループ数・1グループあたりの件数）について、
     一度決定した後に同じ計算・言い直し・再検討をテキストで繰り返して
     いないか。ほぼ同一内容の文章（「グループ数は～」「しかし同時に呼べる
     のは～」等）が2回以上繰り返し出現していたら、これはsystem_prompt修正
     前に実際に観測された退行そのものなので明確に不合格とせよ。
  4. execute_python_code（.mdファイルの生成）を呼ぶ前に、create_plan →
     approve_plan を経由しているか（計画未承認のままブロックされた
     「エラー: 計画が未承認のため実行できません」が返っている場合は不合格）。
  5. execute_python_code の ToolMessage（実行結果）にTracebackやエラーが
     含まれていないか。
  6. execute_python_code に渡されたコード引数（args）から、出力ファイル名が
     `${元画像ファイル名}-${料理名}-${材料}.md`（材料はアンダースコア区切り、
     ファイル名禁止文字を除外）の命名規則に従って組み立てられているか、
     出力フォーマット（# 料理名 / 関連画像ファイル名 / ## 材料 / ## 作り方）
     に沿っているかを確認せよ。
  7. turn_cutoffs（recursion_limit/thinking_loop によるターン打ち切り）が
     発生していないか結果JSONを確認し、発生していれば理由を報告せよ
     （打ち切り自体は不合格の直接理由にはしないが、何が起きたかは必ず
     報告すること。ただし3の再計算ループが打ち切りの原因になっている場合は
     3の不合格理由として扱うこと）。
  8. 最終回答が出力先（mdフォルダ）と処理件数の概要をユーザーへ伝えているか。
  3が該当する場合、または1・4のいずれかに明確に反する場合は不合格とせよ。
notes: >-
  fixtures/レシピ は実際にユーザー報告のループが発生した100件ケースより
  さらに大規模（297枚）の実データ。work_dir はケース実行時に一時ディレクトリへ
  コピーされてから使われるため（run_case.py の shutil.copytree）、フィクスチャ
  本体（実写真）は実行のたびに汚染されない。297枚の analyze_image 相当の
  委譲が発生するため、ローカルllama-serverでは実行に数時間かかる見込み。
  重量級のため system_prompt_scale に置き、/tune-prompt の自動ループには
  含めない。`python evals/run_all.py system_prompt_scale` で手動実行する。
