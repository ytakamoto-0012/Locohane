id: recipe_images_to_md_end_to_end_large
target: system_prompt_scale
work_dir: evals/fixtures/レシピ
timeout_seconds: 21600
auto_approve: true
turns:
  - >-
    imagesフォルダ内の画像ファイルは料理本のレシピの写真です。
    これらの写真の内容を読み取り、mdフォルダにmdファイルでレシピの内容を
    書き出してください。

    出力ファイル名 ${元画像ファイル名}-${料理名}-${材料}.md

    材料は材料の名前を _ アンダーバーでつなぐ。ファイル名に使用できない文字は除外する。

    出力フォーマット

    # 料理名

    関連画像ファイル名： ${ファイル名}

    ## 材料
    画像に記載の材料をここに記載
    分量まで正確に書く

    ## 作り方
    ここに作り方を記述
expect:
  tool_called_any: [dispatch_agent, execute_python_code]
  tool_not_called: [analyze_image]
  tool_call_args_contains:
    dispatch_agent: {agent_type: "worker"}
  response_not_contains: ["申し訳ありません", "できません", "機能がありません"]
judge: |
  images フォルダに297枚の実写真（jpg/png/heic混在）が入った最大規模の
  end-to-end検証ケース。当初は「サブエージェントへの委任件数について」節の
  分割件数目安の一本化（2026-07-31）を検証する回帰ケースだったが、その後
  「読み取った内容をメインへ返させると1リクエストあたりのトークン量が
  単調増加してコンテキスト上限に張り付く」問題が実測で見つかったため、
  読み取りから書き出しまでを委譲先で完結させる書き込み可能サブエージェント
  `worker` を新設した（explore は読み取り専用のまま維持）。本ケースは
  この worker 経由の設計が実際に大量ファイル処理を完走させられるかを
  検証する。

  以下を確認せよ:
  1. 画像の読み取り→mdファイル書き出しは、必ず
     dispatch_agent(agent_type="worker") への委譲経由で行われているか
     （main agent が analyze_image を直接呼んで中身を確認していたら、
     その時点で明確に不合格。dispatch_agent(agent_type="explore") を
     使っていた場合も、worker の目的から外れるため不合格）。
  2. 分割の粒度が妥当か。全297件を1回のdispatch_agentに丸投げしていないか、
     逆に1件ずつ297回に分割するような過度に細かい分割になっていないか。
     目安（${subagent_max_iterations}件、既定30件）を基準にグループ数を
     決めているか（厳密な一致は不要、明らかに不合理な分割でなければよい。
     サブエージェント側のトークン上限に達して1グループを複数回に分割し
     直す再委任は正常な回復動作であり不合格理由にはしない）。
  3. **最重要**: 分割方法（グループ数・1グループあたりの件数）について、
     一度決定した後に同じ計算・言い直し・再検討をテキストで繰り返して
     いないか。ほぼ同一内容の文章が2回以上繰り返し出現していたら、これは
     過去に実際に観測された退行そのものなので明確に不合格とせよ。
  4. `dispatch_agent(agent_type="worker")` への**最初の**委譲より前に、
     create_plan → approve_plan を経由しているか（計画未承認のまま worker
     へ委譲し、書き込みがブロックされて読み取り結果が無駄になっている場合
     は不合格。過去に実際に観測された退行）。
  5. worker から返ってきた ToolMessage（最終回答）が、読み取った本文や
     生成ファイル名の全件一覧を含んでいないか（「処理件数・書き出し件数・
     失敗分・未処理分」程度の要約に収まっているべきで、レシピ本文が丸ごと
     含まれている場合は設計意図に反するため不合格）。
  6. 結果JSONの `token_usage_max_per_call.calls_over_ceiling` が0であるか、
     `token_usage_max_per_call.total_tokens` が64000を大きく超えていないかを
     確認せよ（メインエージェントの1リクエストあたりのトークン量が
     この規模の設計目標であるため。多少の超過だけで即不合格にはしないが、
     結果としてコンテキスト上限（128000）に張り付いていた場合は不合格）。
  7. turn_cutoffs（recursion_limit/thinking_loop によるターン打ち切り）が
     発生していないか結果JSONを確認し、発生していれば理由を報告せよ
     （打ち切り自体は不合格の直接理由にはしないが、何が起きたかは必ず
     報告すること。ただし3の再計算ループが打ち切りの原因になっている場合は
     3の不合格理由として扱うこと）。
  8. 最終回答が出力先（mdフォルダ）と処理件数の概要をユーザーへ伝えているか。
  3・4が該当する場合、または1・5のいずれかに明確に反する場合は不合格とせよ。
notes: >-
  fixtures/レシピ は実際にユーザー報告のループが発生した100件ケースより
  さらに大規模（297枚）の実データ。work_dir はケース実行時に一時ディレクトリへ
  コピーされてから使われるため（run_case.py の shutil.copytree）、フィクスチャ
  本体（実写真）は実行のたびに汚染されない。297枚分の analyze_image 相当の
  読み取り＋書き出しが worker サブエージェント内で発生するため、ローカル
  llama-serverでは実行に数十分〜数時間かかる見込み。重量級のため
  system_prompt_scale に置き、/tune-prompt の自動ループには含めない。
  `python -m evals.run_case evals/cases/system_prompt_scale/002_recipe_images_to_md_end_to_end_large.yaml`
  で手動実行する（`run_all.py` は使わない。001ケースはこのチューニング
  対象には含めない）。
