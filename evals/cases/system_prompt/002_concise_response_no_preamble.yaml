id: concise_response_no_preamble
target: system_prompt
turns:
  - "11は素数ですか？"
expect:
  response_contains: ["はい"]
  response_not_contains: ["以上の結果から","について説明します","ご確認ください"]
  tool_called_any: []
  max_turns: 1
judge: |
  簡潔性ルール（Important Reminders 項目2）の効果測定ケース。
  単純なYes/No質問に対して:
  1. 最終回答が「はい」または「いいえ」の一言〜1文で終わっているか。
  2. 「以上の結果から」「〜について説明します」等の前置きがないか。
  3. 求められていない背景説明（「11は〜なので」等）を追加していないか。
  4. ツール呼び出しをしていないか（この質問にツールは不要）。
  1,2のいずれかに反する場合は不合格。ただし「はい」等の核心部分が含まれていれば、
  若干の冗長さは許容する（厳しすぎても実用性に反する）。
notes: >-
  Important Reminders項目2「レスポンスは簡潔に」の「単純な質問には一言で答える」
  の効果測定。Claude Code公開プロンプトの「数値アンカー」テクニック由来。
