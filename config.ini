# ============================================================================
# Locohane 設定ファイル
#
# すべての接続先・保存先パスをこの1ファイルに集約する（透明性最優先）。
# 各値は環境変数で上書き可能（対応する環境変数名は src/config.py を参照）。
# ============================================================================

[llm]
# --- メインエージェント用の接続先 ---
# llama.cpp server（llama-server）の OpenAI 互換エンドポイント。複数指定した
# 場合は main_routing_strategy に従って呼び出しごとに選ぶ（1件のみなら常に
# それを使う）。1接続先 = {"base_url":..., "api_key":..., "model":...} の
# dict。JSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容。
# [thinking_loop_guard].nudge_messages と同じ記法）で指定する。
#   base_url: 例 http://localhost:8080/v1
#             （例: llama-server --host 127.0.0.1 --port 8080）
#   api_key : llama.cpp は認証不要のためダミー値でよい（空だとクライアントが
#             弾くため何か入れる）。省略時は "dummy-not-used"。
#   model   : llama-server の --model / --alias に合わせて切り替える。
#   start/end: この接続先を使用可能にする時間帯（任意）。単位は時間(H)、
#             分は小数で指定する（例: 9.5 = 9:30、22.25 = 22:15）。
#             start/end は必ずセットで指定する（片方だけの指定は不可）。
#             両方省略すると常時使用可能になる。start > end の場合は日を
#             またぐ範囲として扱う（例: start=22, end=6 なら22:00〜翌6:00）。
#             リスト全体で最低1件は start/end を両方省略した「常時使用可能」
#             な接続先が必要（どの時間帯にも当てはまらない瞬間が生じないよう
#             にするため）。時間帯外の接続先しか無い瞬間は、常時使用可能な
#             接続先（無ければ全接続先）から選ばれる。
#   provider: "openai_compatible"（既定、省略可）または "llama_cpp"。
#             round_robin戦略専用のオプション。"llama_cpp" にすると、
#             その接続先を選ぶ前に GET /slots で空きスロットの有無を確認し、
#             空きが無ければスキップして次点の接続先へ、候補全てが埋まって
#             いれば round_robin_busy_poll_interval_seconds 秒待ってから
#             再確認する（下記参照）。llama.cpp server 固有のAPI（--slots
#             起動オプションが有効な場合のみ動作）のため、それ以外の
#             OpenAI互換サーバーでは指定しないこと（その場合は確認を行わず
#             従来通り即座に選ぶ）。
#    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B"},
#    {"base_url": "http://localhost:12431/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "start": 22, "end": 6, "provider": "llama_cpp"},
main_url = [
    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "provider": "llama_cpp"},
    ]
# main_url が複数ある場合の選び方。
#   round_robin      : 呼び出しごとに順番に回す（既定）。provider="llama_cpp"の
#                       接続先は選ぶ前に GET /slots で空きスロットの有無を
#                       確認し、空きが無ければスキップして次点へ、候補全てが
#                       埋まっていれば空きが出るまで待機する
#                       （round_robin_busy_poll_interval_seconds参照）。
#                       provider="openai_compatible"の接続先は確認せず
#                       従来通り即座に選ぶ。
#   random            : 呼び出しごとにランダムに選ぶ
#   priority_failover : 常に先頭を使い、通信エラー検知時のみ次点へ一時的に切り替える
main_routing_strategy = round_robin

# --- サブエージェント（dispatch_agent）用の接続先 ---
# main_url と同じ形式・既定値。メインエージェントとは別のllama-server
# インスタンス／別モデルへ振り分けたい場合にここを変更する。
# 未指定（キー無し、または値を空にする）の場合は main_url をそのまま使う。
# main_url未指定の時は、 sub_routing_strategyは無効。
sub_url = [
    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "provider": "llama_cpp"},
    ]
sub_routing_strategy = round_robin

# --- 生成パラメータ（main/sub共通） ---
# 生成のばらつき（0.0〜）。ツール呼び出しの安定性を優先し低めに設定
# （変更経緯は evals/tuning_log.md 参照）。
temperature = 0.6
# 累積確率上位のみサンプリングする閾値（0〜1）。空欄なら未指定（llama-server既定に委ねる）。
top_p = 0.95
# 上位k候補のみサンプリングする（llama.cpp拡張、OpenAI標準APIには無い）。空欄なら未指定。
top_k = 20
# 直近生成トークンの再出現を抑制する係数（llama.cpp拡張、1.0=無効、1.1前後で軽く抑制）。
# 空欄なら未指定。thinking（<think>ブロック）内で同じ文言を繰り返すループの抑制に
# 直接効くが、ファイルパス等の反復文字列の生成精度とトレードオフの関係にあるため、
# ループ抑制自体は thinking_loop_guard（アプリ側の検知+リトライ）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
repeat_penalty = 1.0
# 出現済みトークン全体への一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
frequency_penalty = 0
# 一度でも出現したトークンへの一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
presence_penalty = 0
# 1リクエストあたりの最大生成トークン数。空欄なら無制限（llama-server既定に委ねる）。
# thinkingの暴走で応答が返らなくなるケースの歯止めにもなる。
max_tokens =
# --- DRY (Don't Repeat Yourself) サンプラー（llama.cpp拡張） ---
# repeat_penalty より長いフレーズ単位の反復（thinking内で同じ文を繰り返す等）に
# 強く効く。0.0 または空欄で無効。ファイルパス等の反復文字列の生成精度との
# トレードオフがあるため、暴走対策は[thinking_loop_guard]（アプリ側の検知+
# リトライ）と[llm].max_tokens=128000（最終的な歯止め）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
dry_multiplier =
# 反復長に対するペナルティの指数増加率（既定 1.75 相当）。空欄なら未指定。
dry_base =
# この文字数以下の反復は許容する（既定 2 相当）。空欄なら未指定。
dry_allowed_length = 
# 反復検出に遡って見るトークン数（-1 でコンテキスト全体、既定 -1 相当）。空欄なら未指定。
dry_penalty_last_n = 
# 反復検出をリセットする区切り文字（カンマ区切りで複数指定、例: 改行,:,",*）。
# 空欄なら llama-server 既定（改行・:・"・*）に委ねる。
dry_sequence_breakers =
# Qwen3系モデルの thinking（reasoning、<think>ブロック）モードのON/OFF
# （llama.cpp拡張、extra_body の chat_template_kwargs 経由で送る）。
# 空欄なら未指定でモデル・llama-server既定に委ねる。false にすると reasoning
# をオフにする（応答速度は上がるが、複雑なタスクの精度は落ちる可能性がある）。
enable_thinking = true
# thinkingタグ（<think>...</think>）の扱い方（llama.cpp拡張、extra_body 経由で
# 送る。llama-server起動時の --reasoning-format FORMAT と対応する値）。
#   none            : パースせず <think> タグを含めたまま message.content に残す
#   deepseek        : 思考部分を message.reasoning_content に分離して格納する
#                     （本アプリの ChatLlamaCpp はこの形式を前提に
#                     reasoning_content を拾い上げてUIの思考表示に使っている。
#                     src/llm.py の ChatLlamaCpp docstring参照）
#   deepseek-legacy : <think> タグを message.content に残しつつ、
#                     message.reasoning_content にも入れる（旧DeepSeek API互換）
# 空欄なら未指定（llama-server既定の auto ＝テンプレートから自動判定に委ねる）。
reasoning_format = deepseek
# 思考（thinking）に使えるトークン数の上限（llama.cpp拡張、extra_body 経由で
# 送る。llama-server起動時の --reasoning-budget N と対応する値）。
# -1 = 無制限、0 = 即座に思考を終了、N>0 = そのトークン数を上限にする。
# 空欄なら未指定（llama-server既定の -1＝無制限に委ねる）。
reasoning_budget =
# 上記 reasoning_budget を使い切った際に、思考終了タグの直前に挿入する
# メッセージ（llama.cpp拡張、extra_body 経由で送る。llama-server起動時の
# --reasoning-budget-message MESSAGE と対応する値）。空欄なら挿入しない
# （llama-server既定）。
reasoning_budget_message =
# トークン使用量（入力/出力/合計）を取得するかどうか。true にすると
# ChatOpenAI の stream_usage=True が有効化され、Chainlit UI とeval結果に
# トークン数が表示される。llama-server が stream_options.include_usage
# 拡張に未対応でエラーになる場合のみ false にする。
track_token_usage = true
# ==== request_timeout_seconds と stream_chunk_timeout_seconds の関係 ====
# この2つは実装上「入れ子」になっている。langchain_openai の
# stream_chunk_timeout（下のstream_chunk_timeout_seconds）は、内側で
# httpxのread timeout（下のrequest_timeout_seconds）を待つ処理を
# asyncio.wait_forでラップしているだけで、独立に監視しているわけではない。
#   外側: asyncio.wait_for(..., timeout=stream_chunk_timeout_seconds)
#     内側: httpx read（timeout=request_timeout_seconds）
# そのためサーバーがまだ1バイトも返していない区間（＝プロンプト処理
# (prefill)が終わって最初のチャンクが届くまでの待ち時間）は、両方の時計が
# 同時に進む。つまり実際に待てる時間は
#   実効タイムアウト = min(request_timeout_seconds, stream_chunk_timeout_seconds)
# であり、片方だけ大きくしても、もう片方が小さければそちらが先に発火して
# タイムアウトする。数万トークン級の長いプロンプトを送るとprefillが長引く
# ため、両方ともprefill所要時間より十分大きい値にしておく必要がある。
# 「大きい方を上げれば安全」ではなく「小さい方が上限になる」点に注意。
#
# 実測に基づく推奨値の算出は tune-config-timeouts スキルを使うこと
# （evals/analyze_timing.py の算出式。数値が変わったらそちらが正）:
#   request_timeout_seconds      推奨値 = ceil(max_llm_total_seconds × 1.5)（下限60秒）
#   stream_chunk_timeout_seconds 推奨値 = ceil(max_stream_chunk_gap_seconds × 2.0)（下限30秒）
#
# LLMサーバーへの応答待ちタイムアウト秒数（read/write/pool。connectは別途
# 固定10秒）。上記の入れ子構造でいう「内側」＝httpxレベルで、生のバイトが
# ソケットに届く間隔を計測する最も低レベルのタイムアウト。read timeoutは
# チャンク間のアイドル時間の上限で、生成が続く限りチャンク到達のたびに
# リセットされるため、正常な長時間ストリーミングは妨げない（ただし
# ストリーミング開始前のprefill待ち中も時計は進んでいる点は上記参照）。
# ストリームの後始末失敗等でクライアントが壊れたまま次のリクエストが
# ハングし続ける異常事態を検知するための値（変更経緯は evals/tuning_log.md
# 参照）。
request_timeout_seconds = 450
# ストリーミング中にチャンクが一定時間届かない場合のタイムアウト秒数
# (langchain_openaiのstream_chunk_timeout)。上記の入れ子構造でいう「外側」＝
# request_timeout_secondsより一段上のアプリケーション層で、パース済み
# チャンク（SSEの1イベント）が届く間隔を計測する。「チャンクとチャンクの
# 間隔」の上限で、大きなコンテキストのプロンプト処理(prefill)に時間が
# かかる環境(CPU/GPU性能が低い、n-cpu-moeでCPUオフロードしている等)では、
# 生成開始までにこの秒数を超えてタイムアウトしやすい。上記の通り
# request_timeout_secondsも同時に効いているため、こちらだけ上げても
# request_timeout_secondsの方が小さければ意味がない。ライブラリ既定値は
# 120秒。
#
# P4 切り分け実験: この値を 0 に設定すると、langchain_openai 内の
# _astream_with_chunk_timeout で wait_for が無効化され、チャンク単位の
# asyncio.Task 生成（別タスク化）が止まる。これにより 2026-07-28 incident
# で確認された "Attempted to exit cancel scope in a different task" 等の
# RuntimeError が再現しなくなるか確認できる。request_timeout_seconds
# （P0-1 で実効化済み）が read timeout を担保するため、0 でも安全性は
# 損なわれない。実験終了後は元の値（300）へ戻す。
stream_chunk_timeout_seconds = 250
# llama-server への同時リクエスト数の上限。1 以上: asyncio.Semaphore(N) で
# ガードする（既定は 1＝完全直列化）。0 以下: ガード無効（無制限）。
# [graph].max_parallel と [subagent].max_parallel はそれぞれ「1セッションあたり」
# のツール呼び出し・dispatch_agent 並列数を制御する（セッション毎に独立した
# Semaphoreを持つ）のに対し、プロセス全体・全セッション合算で共有される
# llama-server の実スロット数（--parallel）への同時アクセス総数は、この値が
# 一元管理する。運用中の --parallel 値と揃えるのが安全。
max_concurrent_requests = 1

# --- round_robinの/slots空き状況確認（provider="llama_cpp"の接続先のみ対象） ---
# main_routing_strategy/sub_routing_strategy=round_robinが、provider="llama_cpp"
# の接続先を選ぶ前に送る GET /slots 問い合わせ自体のタイムアウト秒数。
# 短めにし、応答が無ければ「わからない」として空きありとみなす（fail-safe。
# 確認できない場合は従来のround_robin＝確認なしの動作に寄せる）。
round_robin_slots_probe_timeout_seconds = 3
# round_robinの候補（時間帯的に使用可能な接続先）全ての空きスロットが
# 無かった場合に、再度 GET /slots で確認するまで待機する秒数。
round_robin_busy_poll_interval_seconds = 5

[paths]
# 各種データ保存先パスの共通ベースディレクトリ。[paths] 配下の
# checkpoint_db/memory_dir/plans_dir、および他セクション（[uploads]/[log]/
# [default_workdir]/[path_memory]/[chat_log]）の dir 系キーの値に
# ${common_data_dir} と書くと、ここで指定した値に置換される
# （configparser標準の補間機能ではなく、src/config.py の load_config() が
# 起動時に行う独自の文字列置換。セクションをまたいで使えるようにするための
# 仕組み）。保存先ルートをまとめて変更したい場合はここだけ変更すればよい。
# 対応する環境変数 COMMON_DATA_DIR で上書き可能（環境変数側の値は
# ${common_data_dir} プレースホルダーの展開対象にはならない。素のパスを
# 直接指定すること）。
common_data_dir = ./data
# スキル定義フォルダ（ここ配下の各サブフォルダの SKILL.md を起動時に走査する）。
skills_dir = ./skills
# エージェント種別定義フォルダ（skills_dir と同格。ClaudeCode の .claude/agents/*.md
# 相当）。ここ配下の各 *.md を dispatch_agent の agent_type 種別として起動時に走査する。
# 1ファイル = 1種別。frontmatterで name/description/tools を指定する
# （tools 省略時は既定のツール一式を継承する）。
agents_dir = ./agents
# プロジェクト固有の拡張ディレクトリ（ClaudeCode の .claude/ 相当）。
# 指定した各ディレクトリ配下の以下3つを起動時に自動検知する（いずれも存在しなくても
# エラーにはならない）:
#   skills/      - skills_dir に追加でマージ走査される追加スキル（同名スキルが
#                  両方に存在する場合はこちら側が優先される）
#   agents/      - agents_dir に追加でマージ走査される追加エージェント種別
#                  （同名定義が両方に存在する場合はこちら側が優先される）
#   LOCOHANE.md  - システムプロンプトの {{project_instructions}} へ差し込まれる
#                  プロジェクト固有の追加指示（ClaudeCode の CLAUDE.md 相当）。
#                  存在しなくてもエラーにはならない（「（プロジェクト固有の指示は
#                  ありません）」が差し込まれるだけ）。1ファイルあたり200行を
#                  超える場合は切り詰められる。
# 複数ディレクトリを指定したい場合は、[thinking_loop_guard].nudge_messages と同じ
# JSON/Python風リスト形式（角カッコ＋改行複数行OK）で指定する。指定順で後方の
# ディレクトリが優先される（skills/agents はマージ、LOCOHANE.mdは見出し付きで
# 連結。マージ・重複排除等は行わない）。例:
# project_locohane_dir = [
#     "./.locohane",
#     "./.locohane_team",
#     ]
project_locohane_dir = [
    "./.locohane",
    ]
# run_script/execute_python_code のサブプロセスへ渡す PATH の先頭に追加する
# ディレクトリ（外部バイナリ実行ファイルの配置先）。コマンド名を素の状態で叩く
# スキルは、OS側のPATH環境変数へユーザーが手動登録していないと「コマンドが
# 見つからない」で失敗する。ここに配置先を明示しておけば、evals・app.py実行時の
# どちらでも手動登録なしで呼び出せる（src/tools.py の _subprocess_env 参照）。
# project_locohane_dir と同じJSON/Python風リスト形式で指定する。存在しない
# ディレクトリは無視される。
bin_path = []

# システムプロンプトのテンプレートファイル（{{skills}} にスキル一覧を差し込む）。
system_prompt_path = ./system_prompt/system_prompt.md
# LangGraph の会話状態（チェックポイント）を溜める SQLite ファイル。
checkpoint_db = ${common_data_dir}/checkpoints.sqlite
# 永続メモリーの保存先（user/feedback/project/reference のサブフォルダと MEMORY.md 索引を持つ）。
memory_dir = ${common_data_dir}/memory
# create_plan が detail_markdown 引数を渡した際に書き出す、実行計画の詳細
# Markdownファイルの保存先。会話スレッドごとに1ファイルで、create_plan を
# 呼ぶたびに上書き更新される（任意機能のため空でもエラーにはならない）。
plans_dir = ${common_data_dir}/plans
# help ツールが読み込んで返すヘルプ本文（ユーザー向け、Markdown）。
help_path = ./system_prompt/help.md

[uploads]
# Chainlit へのアップロードファイルの保存先。
dir = ${common_data_dir}/uploads
# アップロードファイルの保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。
# 0 以下を指定すると自動削除を無効化する。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chainlit_files]
# show_image（cl.Image添付）や、回答本文への画像埋め込み
# （app.py の _embed_local_images_as_session_urls）がブラウザへ配信する際に
# 使う、Chainlit自身のセッションファイルディレクトリ（プロジェクト直下
# .files/<セッションID>/。パスはChainlitが管理しており、ここでは変更
# できない）の自動削除設定。Chainlit自身にもブラウザ切断時の削除処理は
# あるが、プロセス再起動等では確実に働くとは限らないため、他の data/* 配下
# と同様に日数ベースの自動削除を保険として用意する。
# ディレクトリ単位（セッションID配下ごと）で削除する点が他セクションと異なる。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[elements]
# show_image/provide_download 等の添付ファイル・回答本文への画像埋め込みを、
# スレッド再開・プロセス再起動後も表示できるよう永続化する保存先
# （src/thread_store.py の create_element/get_element、
# app.py の _embed_local_images_as_session_urls 参照）。
# [chainlit_files] のセッション一時配信とは別に、ここへ実体をコピー保存する。
dir = ${common_data_dir}/elements
# 保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。
# 0 以下を指定すると自動削除を無効化する。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[images]
# 画像をLLMへ渡す前に縮小する際の、長辺のピクセル数の上限
# （analyze_image ツールと、ユーザーがアップロードした画像の両方に効く）。
# 「DPI」ではなく長辺ピクセル数で指定しているのは、スマホ撮影のJPEGはDPI
# メタデータを持たない/当てにならない一方、Visionモデルが消費するトークン量は
# 画素数でほぼ決まるため。値を下げるほど1回のサブエージェント委任で扱える
# 枚数が増えるが、写真に写り込んだ細かい文字は読み取りにくくなる。
# 0 を指定すると縮小しない（元の解像度をそのまま送る）。
# 画像の長辺が既にこの値以下の場合は再エンコードせず元データをそのまま使う。
max_long_side_pixels = 2048
# 縮小後に再エンコードするJPEGの品質(1-95)。文字が写り込んだ画像を読み取らせる
# 用途では下げすぎると判読できなくなるので85以上を推奨。
jpeg_quality = 85
# LLMの回答本文（Markdownテーブルのセル等）へ直接埋め込む画像プレビューの、
# 長辺ピクセル数の上限。上記 max_long_side_pixels（Vision向け）とは別の、
# 意図的に小さい値（app.py の _embed_local_images_as_session_urls が
# show_image と同じセッションファイル配信経路でブラウザへ渡す。セル内の
# サムネイル用途なので、表示帯域・ディスク使用量を抑える観点で小さめでよい）。
inline_preview_max_long_side_pixels = 192
# 上記サムネイルの再エンコード品質(1-95)。
inline_preview_jpeg_quality = 70

[default_workdir]
# エージェントの既定の作業ディレクトリ（run_script の cwd、スクリプトが生成する
# ファイルの出力先の基準になる）。作業フォルダアイコンで
# セッション単位の作業ディレクトリが指定されなかった場合に使われる。
dir = ${common_data_dir}/temp
# 上記 dir 直下に溜まり続けるファイルの保持日数。この日数を過ぎた（更新日時が古い）
# ファイルは自動削除する。0 以下を指定すると自動削除を無効化する。ユーザーが
# ChatSettings で指定したセッション単位の work_dir は対象外（dir のみが対象）。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 上記の dir（default_workdir）に加えて、書き込みサンドボックスガードが
# 書き込み・削除を許可する追加のディレクトリ。運用者が用意した固定の
# 共有出力先などを登録する用途（既定は空、書き込みサンドボックス原則
# そのものは変わらない）。
# 対象は run_script/run_script_background 経由のみ。execute_python_code/
# execute_python_code_background（LLMが自由生成したコードをその場で
# 実行するツール）は対象外で、常に従来通り work_dir/default_workdir
# 限定のままになる（危険度が高いため）。
# 各要素は {"dir": ディレクトリ, "allow_entries": [...]} の辞書形式。
# JSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容、
# [thinking_loop_guard].nudge_messages と同じ記法）で複数指定できる。
#   dir          : 許可するディレクトリ（相対パスは本ファイルからの相対、
#                  絶対パスも可）。存在しないディレクトリは無視される。
#   allow_entries: そのディレクトリへの書き込みを許可する対象のリスト。
#                  [main_agent_tool_guard].allow_entries と同じ形式で、
#                  各要素は次の2種類のいずれか:
#                    - "ツール名"（ビルトインツール名。現状、書き込み
#                      サンドボックスガードを持つビルトインツールは
#                      run_script/run_script_background のみのため実質
#                      未使用だが、将来の拡張用に形式を合わせてある）
#                    - ["スキル名","スクリプトファイル名"]（run_script/
#                      run_script_background 経由で呼ばれるスキル
#                      スクリプトのみを許可）
#                  空リストなら対象を問わず無制限に書き込み可（誰でも
#                  書き込める）。
# 登録したディレクトリはセッション・スレッドを問わず常時書き込み可能になる
# 点に注意（work_dir/default_workdirのようなセッション専用の分離は効かない）。
# 例:
# allow_sandbox_dir = [
#     {"dir": "E:/shared_output", "allow_entries": [["excel-edit", "write_excel.py"]]},
#     ]
allow_sandbox_dir = []

[path_memory]
# パスメモリー（src/path_memory.py）が会話ごとのレジストリファイル
# （<thread_id>.json）を保存するディレクトリ。
dir = ${common_data_dir}/path_memory
# 保持日数。この日数を過ぎた（更新日時が古い）レジストリファイルは自動削除する。
# 「会話終了」を明示的に検知する手段が無いため、日数ベースで管理する。
retention_days = 1
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 1会話あたりの登録上限件数。
max_entries = 10000

[log]
# アプリログの出力先ディレクトリ。
dir = ${common_data_dir}/logs
# ログの詳細度。次の3値のいずれか:
#   info  - 現行仕様。各ツール呼び出しの概要（ツール名・要約引数）のみ記録する。
#   debug - info に加えて、ツール呼び出しの全引数・全結果、LLMの応答本文・
#           thinking（reasoning_content）まで記録する（情報量・ファイルサイズが
#           大きく増える。障害調査でモデルの挙動を忠実に追いたいときに使う）。
#           ※コンソールには一切出力されない（file_handler のみ）。
#           ※openai/httpx/httpcore/aiosqlite/asyncio 由来の DEBUG ログは抑制される。
#   none  - ログ出力を一切行わない（data/logs/app_*.log を含め何も生成しない）。
level = debug
# 起動のたびに新しい app_*.log ファイルを作成するか、直近の既存ファイルに
# 追記を試みるか（true/false）。
# false（既定）: 直近の app_*.log への追記を試みる（既に max_lines を
#                超えていれば、その場で新しいファイルにローテーションする）。
# true          : 起動のたびに必ず新しい日時つきファイルを作成する。
# level=none のときはログ自体を出さないため、このフラグは意味を持たない。
clear_on_startup = true
# app_*.log（上記 dir に出力されるアプリログ）1ファイルあたりの
# 最大行数。この行数を超えたら、新しい日時つきファイル名
# （例: app_20260725_143012.log）へローテーションする。
# ファイル名の日時はローテーションのたびに「今」の日時で付け直す
# （起動時刻固定ではない）。同一秒に複数回ローテーションする場合は
# _1, _2... の連番を付けて衝突を避ける。
# 1レコード（例外トレースバック等）が複数行になる場合はその全行をカウント
# するため、閾値は「ファイルの実際の行数」を指す。level=none のときは
# app_*.log自体を生成しないため意味を持たない。
max_lines = 5000
# ローテーションで増え続ける古い app_*.log の保持日数。この日数を過ぎた
# （更新日時が古い）ファイルは自動削除する。0 以下を指定すると自動削除を
# 無効化する。同じ dir に evals/run_case.py が書き出す evals.log は
# 別扱いのため削除対象に含まれない。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chat_log]
# 会話ログ（ユーザー発言とAIの最終応答）をテキストファイルへ記録する機能の有効/無効。
# false（既定）: 記録しない。
enabled = true
# 会話ログの保存先ルートディレクトリ。<dir>/<ユーザー名>/<日付>_<thread_id>.log の
# 構成で書き出す。ユーザー名はログイン中のユーザー識別子（[auth] enabled=false の
# 場合は "anonymous" にまとめる）。
dir = ${common_data_dir}/logs_chat

[thread_store]
# 会話スレッド一覧（画面左サイドバー）・過去の会話を選んで再開する機能の有効/無効。
# true（既定）: 有効。false にするとサイドバー自体が表示されなくなり、
# 機能追加前と同じ単一セッションの挙動に戻る。
enabled = true
# スレッド一覧・Step履歴の保存先SQLiteファイル。data/checkpoints.sqlite
# （LangGraphの会話状態そのもの）とは別ファイル。一覧表示・再開に必要な
# メタデータのみを持つ軽量なストア。
db = ${common_data_dir}/chat_threads.sqlite
# スレッド一覧の保持日数。この日数の間更新が無いスレッドを自動削除する。
# 0以下（既定）で無効化＝無期限保持。削除してもLangGraph側の会話状態
# （checkpoints.sqlite）自体は消さない（一覧に出なくなるだけ）。
retention_days = 0
# 上記の自動削除チェックの実行間隔（時間）。
cleanup_interval_hours = 1

[chat_starters]
# チャット開始時に表示する定型文ボタン。クリックするとそのままメッセージとして送信され、
# タスクが開始する。[thinking_loop_guard].nudge_messages と同じJSON/Python風リスト形式
# （角カッコ＋改行複数行OK、末尾カンマ許容）で指定する。空リスト[]ならボタンを表示しない。
prompts = [
    "使い方を教えて",
    "Office系、PDFが作成、編集できるって本当？",
    "Excel マクロ(VBA)の作成・編集ができるって本当？",
    ]

[scripts]
# run_script ツール・execute_python_code ツール共通の実行設定。
# 実行タイムアウト秒数（run_script / execute_python_code 共通）。
timeout = 300
# .py スクリプトを起動する Python 実行ファイル（run_script / execute_python_code 共通）。
python = C:\DT_Python\Python311\env_local_agent_system\Scripts\python.exe
# execute_python_code ツール（LLMが生成したPythonコードをその場で実行する）の有効/無効。
# false にすると、ツール自体は呼び出されてもエラーを返すだけになり、コードは実行されない。
code_execution_enabled = true
# ここから run_script_background（バックグラウンド実行版）専用の設定。
# バックグラウンドジョブを強制終了するまでの上限秒数（timeout とは別軸。
# 同期版 run_script より長時間の実行を想定した上限）。
background_max_runtime_seconds = 3600
# ジョブが完了・失敗・タイムアウト等で終了した後、check_script_job で一度も
# 取得されないまま残ってよい秒数。超過分は次回の run_script_background 呼び出し
# 時に破棄される。
background_job_retention_seconds = 120
# check_script_job が「実行中」ステータスを返した直後、同じジョブへの次の
# check_script_job 呼び出しを許可するまでの最短間隔秒数。SKILL.md やツールの
# docstringで「数秒おきに呼び直さない」よう指示しても、ローカルLLMが指示に
# 従わず数秒おきに再確認し続ける事例があったため、サーバー側で強制する
# （間隔未満での呼び出しは下記 background_min_poll_message を返すのみで、標準
# 出力・標準エラーは含めない）。0以下を指定すると強制を無効化する。
background_min_poll_interval_seconds = 60
# 上記の最短間隔未満で check_script_job が呼ばれた際に、拒否の代わりにLLMへ
# 返すメッセージ。空欄なら組み込みの既定文言（「まだ確認間隔が短すぎます。
# あと約N秒待ってから…」）を使う。Python の str.format() 記法で下記3つの
# プレースホルダーを埋め込める（これ以外の名前を書くとサーバー起動時に
# エラーになる）。
#   {wait_remaining} : あと何秒待てば呼び直せるか（整数、切り上げ）
#   {job_id}         : 対象ジョブID（repr形式。{job_id!r} と書くと引用符付きで
#                       埋め込まれ、check_script_job(job_id=...) にそのまま
#                       貼り付けられる形になる）
#   {min_interval}   : background_min_poll_interval_seconds の値そのもの
# 例:
# background_min_poll_message = ポーリング間隔が短すぎます。約{wait_remaining}秒後に check_script_job(job_id={job_id!r}) を再実行してください（最短間隔: {min_interval}秒）。
background_min_poll_message =
# run_script_background/execute_python_code_background のツール呼び出しが、
# ジョブ完了をこの秒数までLLMを介さずコード側で待つ（Chainlit UI上はターンが
# ブロックされたまま「実行中」表示が続く）。この秒数を超えてもまだ実行中の
# 場合のみ、job_id を返してLLMへ制御を戻す（フォールバック。以降は
# check_script_job で確認する）。ジョブ自体はこの上限に達してもキャンセル
# されず裏側で動き続ける。
# 0以下を指定すると無期限待ちになり、この安全上限フォールバック自体が
# 発生しなくなる（job_id が返ることはなく、check_script_job/stop_script_job
# も実質使われなくなる）。取りやめたい場合は Chainlitの停止ボタンを使う
# （内部のジョブも確実に終了させられる）。
background_inline_wait_max_seconds = 0
# 上記の待機中、人間向けに経過秒数・標準出力/標準エラー末尾をチャットへ直接
# 送る間隔（秒）。cl.Message送信のみでLLM呼び出しを伴わないためトークンは
# 消費しない。
background_progress_push_interval_seconds = 20
# 上記の進捗表示、および check_script_job/stop_script_job/read_thread_note が
# 「実行中」「強制終了時点」等で末尾のみ表示する際の、標準出力/標準エラー/
# 進捗メモの最大文字数。全量を表示するとコンテキストを圧迫するため切り詰める。
# dispatch_agent の進捗表示（[subagent]配下）も同じ値を共有する。
background_job_output_tail_chars = 256
# run_script/run_script_background の計画承認（Plan Mode）を免除する
# 読み取り専用スクリプトのホワイトリスト。[["スキル名","スクリプトファイル名"], ...]
# のPython/JSON風リスト形式で指定する（末尾カンマ可）。空欄なら下記の既定7件を使う。
# 対象は「副作用のない読み取り専用スクリプト」に限定すること（書き込み系スクリプトを
# 追加すると計画承認なしに書き込みが実行されてしまうため注意）。
plan_approval_exempt_scripts = [
    ["excel-vba-read","read_vba.py"],
    ["excel-read","read_excel.py"],
    ["excel-render","render_excel.py"],
    ["docx-read","read_docx.py"],
    ["docx-render","render_docx.py"],
    ["pdf-tools","read_pdf.py"],
    ["pdf-tools","render_pdf_pages.py"],
    ["pptx-read","read_pptx.py"],
    ["pptx-inspect","inspect_pptx.py"],
    ["pptx-render","render_pptx.py"],
    ["web-search","search_web.py"],
    ]
# dispatch_agent サブエージェントの agent_type ごとに run_script
# で呼べるスキル/スクリプトを制限するホワイトリスト（未登録の agent_type は制限なし）。
# ここで登録した内容は agents/*.md の {{run_script_allowlist}} プレースホルダーへ、
# agent_type ごとに絞り込んだ形で自動的に差し込まれる（{{skills}}と同じ仕組み）。
# [[agent_type, 対象], ...] のPython/JSON風リスト形式で指定する（末尾カンマ可）。
# 空欄なら下記の既定19件を使う。対象は次の2種類のいずれか:
#   - "スキル名"                       : そのスキル配下の全スクリプトを許可
#   - ["スキル名","スクリプトファイル名"] : そのスクリプトのみ許可
# pdf-tools のように同一スキル配下に読み込み専用スクリプト（read_pdf.py/
# render_pdf_pages.py）と書き込みスクリプト（create_pdf.py）が混在するスキルは、
# スキル名単位ではなく後者の形式で個別に許可すること。
agent_type_run_script_allowlist = [
    ["explore-websearch","web-search"],
    ["explore","docx-render"],
    ["explore","docx-read"],
    ["explore","excel-render"],
    ["explore","excel-read"],
    ["explore","excel-vba-read"],
    ["explore","pptx-render"],
    ["explore","pptx-read"],
    ["explore","pptx-inspect"],
    ["explore",["pdf-tools","render_pdf_pages.py"]],
    ["explore",["pdf-tools","read_pdf.py"]],
    ["verifier","excel-render"],
    ["verifier","excel-read"],
    ["verifier","docx-render"],
    ["verifier","docx-read"],
    ["verifier","pptx-render"],
    ["verifier","pptx-read"],
    ["verifier","pptx-inspect"],
    ["verifier",["pdf-tools","render_pdf_pages.py"]],
    ["verifier",["pdf-tools","read_pdf.py"]],
    ]

[file_tools_duplicate_guard]
# Read/Glob/Grep/json_query/read_skill/read_skill_file/get_tool_source
# ツールを同一引数で繰り返し呼び出すのを防ぐガード機能の設定。これらは
# 読み取り専用のため、同一引数での再実行は結果が変わらないと保証できる
# ことを利用している（小型ローカルモデルが進捗の無いまま同じ呼び出しを
# 会話全体を通じて散発的に繰り返す事例への対策。read_skill/read_skill_file
# は加えて、コンテキスト圧縮で過去の読み込み結果がメッセージ履歴から
# 消えた後に同じ大きいSKILL.md等を何度も読み直すthrashingの対策も兼ねる。
# src/tools.py の _check_file_tools_duplicate / _record_and_check_duplicate 参照）。
enabled = false
# 同一シグネチャ（ツール名+引数）の呼び出しを何回まで許可するか
# （この回数に達した以降の呼び出しをエラーで拒否する）。既定は1回
# （＝初回のみ許可し、2回目以降は拒否）。
max_calls = 5
# サブエージェント（dispatch_agent）内での呼び出し履歴を、メインエージェントの
# 判定へ持ち越すかどうか。
#   true　　　　  : メインエージェントとサブエージェントで呼び出し集合を共有する。
#                   例えばサブエージェントが読んだファイルを、その後メイン
#                   エージェントが同じ引数で読もうとしても重複として拒否される。
#   false         : メインエージェントとサブエージェントの呼び出し履歴を別々に
#                   管理する。サブエージェント内の呼び出しはメインエージェント側の
#                   判定に影響しなくなる（逆にメインエージェントの呼び出し履歴も
#                   サブエージェント側の判定には影響しない）。
carry_over_to_main = false

[main_agent_tool_guard]
# メインエージェント自身が「登録済みのツール」を直接呼び出せる回数を制限する
# 汎用ガード。ビルトインツール名（例: Glob・analyze_image）・run_script配下の
# スキルスクリプト（例: pdf-tools/render_pdf_pages.py）のどちらも同じリストへ、
# エントリごとに上限回数（max_calls）を指定して登録できる（旧・Glob専用ガード
# main_agent_glob_guard は本ガードへ統合済み。既定の allow_entries に ["Glob", 1] を
# 含めることで従来と同じ挙動を引き継ぐ）。
# [scripts].plan_approval_exempt_scripts は計画承認（Plan Mode）を免除するだけで、
# 免除されたスクリプトをメインエージェントが直接・繰り返し呼ぶこと自体は妨げない。
# このため、例えば render_pdf_pages.py でスキャンPDFを画像化し、その結果へ
# メインエージェント自身が analyze_image を委譲せず何十枚も連打してトークン上限に
# 達する事例が起きた（英検3級の単語PDF調査、issue/20260811_*参照。実際の主因は
# render_pdf_pages.py の連打ではなく analyze_image の直接連打だった）。
# サブエージェント（dispatch_agent）内部での呼び出しは対象外（調査そのものが
# 役目のため）。src/tools.py の _guard_main_agent_tool_limit 参照。
enabled = true
# 許可リスト（ホワイトリスト）。ここに登録されていないツール名・run_script
# スキルスクリプトは、enabled=true の間メインエージェントから一切呼び出せない
# （未登録＝呼び出し不可。dispatch_agent配下のサブエージェントは対象外）。
# 各要素は [対象, max_calls] の2要素（末尾カンマ可のPython/JSON風リスト形式）。
# キー名 allow_entries が示す通り、本ガードは「登録した対象だけを許可する」
# ホワイトリストであり、ブロック対象の指定ではない。
# max_calls はエントリごとに個別指定する（メインエージェントが1ターンあたり
# そのエントリを直接呼び出せる回数の上限）:
#   - 0     : 登録はするが完全ブロック（1回も呼び出せない）
#   - -1    : 登録した上で回数無制限に許可する
#   - 1以上 : その回数まで許可し、超過分を拒否する
# 他の呼び出し回数ガード（file_tools_duplicate_guard等）は0以下を「無制限」
# として扱うが、本ガードは0と-1の意味が逆になるので注意。
# 対象（1つ目の要素）は次の2種類のいずれか:
#   - 文字列1件（例: "Glob", "analyze_image"）  : ビルトインツール名そのもの
#   - ["スキル名","スクリプトファイル名"]        : run_script/run_script_background
#                                              経由で呼ばれるスキルスクリプト
# 空欄なら何も登録されず、enabled=true の間メインエージェントは
# いかなるツールも呼び出せなくなる。
#
# MCPサーバー（[mcp]セクション）経由で動的に追加されるツールは名前が実行時
# にしか分からないため、ここに事前登録できない。MCPサーバーを新たに接続する
# 場合、そのツール名を明示的にこのallow_entriesへ追加登録しない限り、メイン
# エージェントからは一切呼び出せない点に注意（サブエージェント経由なら
# 本ガードの対象外なので使える）。
#
# --- 重量系ツール（トークン消費が大きく、連打によるトークン上限到達の実例が
#     あるもの）: Glob以外はあえて登録しない ---
# Read/Grep/json_query/analyze_image/execute_python_code系/skills/配下の
# 全スキルの全エントリースクリプトは、許可リスト方式のもとでは「allow_entries に
# 書かない」だけで自動的に完全ブロックされる（未登録＝呼び出し不可のため、
# わざわざ max_calls=0 で明示登録する必要はない）。dispatch_agentへの
# 委譲を必須にする狙いは変わらない。
#
# --- メインエージェントの基本運用に必須のツール: max_calls=-1（無制限）で登録 ---
#   - dispatch_agent / check_dispatch_agent_job / stop_dispatch_agent_job
#     （委譲の仕組みそのもの。1ターンで複数フォルダへ委譲するのが正常な使い方）
#   - create_plan / approve_plan / update_task_progress / get_plan_status / lock_plan_mode
#     （計画は複数ステップを持つのが通常で、update_task_progressはステップ数分呼ぶ）
#   - AskUserQuestion / ask_user_choice（複数項目の確認で複数回呼ぶことがある）
#   - create_memory / update_memory / delete_memory / read_memory / search_memory / list_memories
#     （1ターンで複数の記憶を扱うことがあり、内容も小さくトークンリスクが低い）
#   - read_skill / read_skill_file / get_tool_source（1ターンで複数スキルを読むのが正常）
#   - check_script_job / stop_script_job（ジョブ管理）
#   - check_work_dir_status / list_path_memory / provide_download / show_image / help
#     / write_thread_note / list_thread_notes / read_thread_note
#     （トークンリスクが低い軽量ツール）
# run_script / run_script_background は裸のツール名としては登録しない
# （登録するとどのスキルスクリプトを実行したかに関わらず一括制限されてしまい、
# 下記の [スキル名,スクリプトファイル名] 単位の粒度が意味を失うため）。
# このため新規スキルスクリプトを追加した場合、下のallow_entriesへ個別に追記しない
# 限りメインエージェントからは実行できない（サブエージェント経由なら実行可能）。
allow_entries = [
    ["dispatch_agent", -1],
    ["check_dispatch_agent_job", -1],
    ["stop_dispatch_agent_job", -1],
    ["create_plan", -1],
    ["approve_plan", -1],
    ["update_task_progress", -1],
    ["get_plan_status", -1],
    ["lock_plan_mode", -1],
    ["AskUserQuestion", -1],
    ["ask_user_choice", -1],
    ["create_memory", -1],
    ["update_memory", -1],
    ["delete_memory", -1],
    ["read_memory", -1],
    ["search_memory", -1],
    ["list_memories", -1],
    ["read_skill", -1],
    ["read_skill_file", -1],
    ["get_tool_source", -1],
    ["check_script_job", -1],
    ["stop_script_job", -1],
    ["check_work_dir_status", -1],
    ["list_path_memory", -1],
    ["provide_download", -1],
    ["show_image", -1],
    ["help", -1],
    ["write_thread_note", -1],
    ["list_thread_notes", -1],
    ["read_thread_note", -1],
    ]
#    [["skill-creator","aggregate_results.py"], 1],
#    [["skill-creator","make_eval_case.py"], 1],
#    [["skill-creator","propose_description.py"], 1],
#    [["skill-creator","run_isolated_eval.py"], 1],
#    [["skill-creator","run_trigger_eval.py"], 1],
#    [["skill-creator","scaffold_skill.py"], 1],
#    [["skill-creator","validate_skill.py"], 1],


[graph]
# ReAct ループの実装切替。
#   "handwritten" : 手書き StateGraph（agent/tools ノードを自前配線。挙動を追いやすい）
#   "prebuilt"    : LangGraph 標準の create_react_agent（実装は最小だが内部は隠蔽される）
implementation = prebuilt
# メインの ReAct ループ（agent→tools 遷移）の最大反復回数。LangGraph の
# recursion_limit にそのまま渡す。超過時は GraphRecursionError を app.py 側で
# 捕捉し、ユーザーに打ち切りメッセージを表示する。
# 単位はノード遷移数（agent/tools 各1ステップ）で、[subagent] max_iterations
# （agent↔tools 往復回数）とは数え方が異なる点に注意。
recursion_limit = 500

# --- 接続エラー時の自動リトライ（メインエージェント） ---
# LLMサーバーとの通信エラー（接続失敗・5xx・httpx系）を検知した場合、直近
# 使用した接続先を一時的にクールダウンした上で（main_routing_strategy=
# priority_failoverの場合のみ次点の接続先へ切り替わる。round_robin/randomは
# 呼び出しごとに元から切り替わるため実質そのまま次点に回る）、LLMグラフを
# 再構築してから同じ反復をこの回数まで自動リトライする。0を指定すると
# リトライせず、ユーザーへ通信エラーを通知してターンを中断する（従来の
# 挙動）。サブエージェント（dispatch_agent）側は [subagent] セクションの
# background_llm_timeout_max_retries を使う。
connection_error_max_retries = 3

# --- 並列数ガード ---
# メインエージェントのツール呼び出し（ImageAwareToolNode 経由）を、1セッション
# あたり同時に何件まで並列実行してよいか。LangGraph の ToolNode は同一
# AIMessage内の複数tool_callsを asyncio.gather() で完全並列実行するため、
# モデルが1ターンで複数ツールを呼ぶと、呼び出し順とレスポンス処理順が
# 食い違ったり、共有リソース（llama-server・DB等）への同時アクセスが起きうる
# （[subagent] max_parallel と同じ理由づけのメインエージェント版）。
# セッション（thread_id）ごとに独立した asyncio.Semaphore を持つため
# （src/tools.py の _TOOL_CALL_SEMAPHORES 参照）、この値は「1セッションが
# 同時に使える枠」の上限であり、複数セッションが同時にこの枠を使うこと自体は
# 妨げない。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする
#   （既定は1＝完全直列化。呼び出し順序も asyncio.Semaphore のFIFOキューにより
#   ある程度保たれる）。
# 0以下: ガードを無効化し、並列呼び出しをそのまま許可する。
#   注: llama-server への同時リクエスト総数（全セッション合算）は
#   [llm].max_concurrent_requests が一元管理する
#   （src/llm.py の _LLM_REQUEST_SEMAPHORE 参照）。
# 注: この値を上げても、並列化されるのはツール呼び出しの実行だけで、
#   main_url/main_routing_strategy による接続先の振り分けとは無関係。
#   メインエージェントのモデル接続先はグラフ構築時（会話開始・再開時）に
#   一度だけ main_routing_strategy に従って選ばれ、そのセッション中は
#   同じ接続先を使い続ける（build_model() は生成のたびには呼ばれない。
#   src/llm/chat_model.py の build_model() docstring参照）。つまり
#   max_parallel を2以上にしても、複数のmain_url接続先へ分散されることはない。
max_parallel = 1

# --- メインエージェントのトークンガード ---
# メインエージェントの直近1回のLLM応答の total_tokens が閾値に達したら、次の
# モデル呼び出しの入力へ handoff_prompt_path の文言を差し込み、「ユーザーへの
# 状況報告」と「新しいチャットで再開するための引継ぎプロンプト」を出力させて
# 安全に終える（src/main_token_guard.py 参照）。サブエージェント側の
# [subagent].token_guard_* のメインエージェント版。LLM自身は自分のトークン
# 使用量を認識できないため、コード側で判定する。track_token_usage=false の
# 場合は usage_metadata が取得できず実質発火しない。
token_guard_enabled = true
# 低パラメータモデルでは1リクエストあたりのトークン数が一定を超えると処理を
# 続けられなくなる。その実効上限（例: 64000）から、ツール結果1往復ぶんの
# 増加量の余裕を引いた値にすること。
# （実測: この仕組みが無い状態では1リクエストあたり24,833→128,000まで単調に
# 増加し、コンテキスト上限に張り付いて処理が停止した）
token_guard_soft_threshold = 98000
# 上記で差し込む文言（新しいチャットへの引継ぎ手順）のMarkdownファイル。
handoff_prompt_path = ./system_prompt/handoff_prompt.md

[subagent]
# dispatch_agent ツールが内部で回す ReAct ループの最大反復回数（agent→tools 遷移の回数）。
# 超過した場合は打ち切り、その時点までに集められたツール結果を要約して返す
# （変更経緯は evals/tuning_log.md 参照）。
#
# この値は system_prompt.md から ${subagent_max_iterations} として参照され、
# 「1回の dispatch_agent に渡すファイル件数の目安（バッチサイズ）」としても使う。
# 本来の意味（反復回数）とは別用途だが、プロンプト側に根拠の無い数値を直書きする
# のを避けるため、出典をこの1箇所に集約している。
# 補足: サブエージェントは複数のツール呼び出しを同一ターンで並列発行するため、
# 実測では反復回数は2回程度で頭打ちになり、この値が反復側の制約になることは
# ほぼ無い。実質的な上限は下の token_guard_* 側である。したがってバッチサイズを
# 増減したい場合、この値を変えるだけでは足りず token_guard_* も併せて見ること。
max_iterations = 100

# --- 並列数ガード ---
# dispatch_agent ツールの実LLM呼び出しを、1セッションあたり同時に何件まで
# 許可するか。モデルが1ターンで dispatch_agent を複数回呼ぶと、ToolNode の
# 仕様上それらは並列実行される。バックエンドが単一インスタンスの
# llama-server の場合、--parallel で設定したスロット数を超えて並列に複数
# リクエストが飛ぶと、AIMessage の tool_calls に対応する ToolMessage が
# 欠落してチェックポイントが破損し、次のモデル呼び出しで LangGraph が
# ValueError を送出する不具合が本番で確認されたため導入
# （src/tools.py の _DISPATCH_AGENT_SEMAPHORES）。
# セッション（thread_id）ごとに独立した asyncio.Semaphore を持つため、
# この値は「1セッションが同時に使える枠」の上限であり、複数セッションが
# 同時にこの枠を使うこと自体は妨げない。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする。
#   運用中の llama-server の --parallel 値と揃えるのが安全（既定は1＝完全直列化）。
# 0以下: ガードを無効化し、dispatch_agent の並列呼び出しをそのまま許可する
#   （複数llama-serverインスタンス等での検証用）。
#   注: llama-server への同時リクエスト総数（全セッション合算）は
#   [llm].max_concurrent_requests が一元管理する
#   （src/llm.py の _LLM_REQUEST_SEMAPHORE 参照）。
# 注: [graph].max_parallel と異なり、こちらは並列起動される dispatch_agent
#   ごとに個別に build_model(role="sub") が呼ばれるため、sub_routing_strategy
#   による振り分けが実際に働く。ただし [llm].sub_url を独自に複数設定して
#   いる場合（sub_endpoints_inherit_main=false）に限る。sub_url未設定
#   （既定・sub_endpoints_inherit_main=true）の場合は、並列起動された
#   dispatch_agent全てがメインエージェントの直近選択接続先をそのまま継承する
#   ため分散されず、全て同じ接続先に集中する（src/llm/routing.py の
#   _select_endpoint() inherit_from_role 参照）。
max_parallel = 1

# --- トークン使用量ガード ---
# dispatch_agent 内のLLM応答1回分の usage_metadata.total_tokens を監視し、
# 閾値超過時に「注意喚起（ソフト）→打ち切り（ハード）」の二段階制御を行う。
# LLM自身は自分のトークン使用量を認識できないため、コード側（src/subagent.py）
# で判定する。track_token_usage=false の場合は usage_metadata が取得できず
# 実質発火しない。
token_guard_enabled = true
# 直近1回の応答の total_tokens がこの値以上になったら、そのiterationの
# tool_callsは通常通り実行した上で、次のモデル呼び出し前に「まとめて回答せよ」
# という注意メッセージを1回だけ注入する。[llm].max_tokens（絶対的なモデル側の
# 上限）や[context_compaction].token_threshold（メイングラフ全体の圧縮閾値）
# より小さめの水準にすること。
token_guard_soft_threshold = 90000
# ソフト警告後もなお total_tokens がこの値以上の応答が続いた場合、その
# tool_callsは実行せず、それ以上model.ainvoke()を呼ばずに打ち切る
# （max_iterations到達時と同じ要約フォーマットで返す）。ソフト警告注入後の
# 「次の1応答」分のバッファを見込み、token_guard_soft_thresholdより余裕を
# 持たせた値にすること。[context_compaction].token_threshold（メイングラフ
# 全体の圧縮閾値）を下回る水準にすることで、メイングラフ側の圧縮閾値に
# 達するより先にサブエージェント側で自律的に収束させる狙い。
token_guard_hard_threshold = 128000
# ソフト閾値到達時に1回だけ注入する注意メッセージの文言。LLMに「まず
# write_thread_noteに未記録の事実を書き出し、その上で次の応答は簡潔に
# まとめよ」と伝える内容にすること（「次の応答でまとめて回答せよ」だけだと
# write_thread_noteに何も書かないまま調査結果を最終回答の本文へ丸ごと
# 書き写してしまい、書き出しの目的＝委譲元の会話履歴肥大化の回避が
# 果たされない。2026-08-21実例: explore系サブエージェントがwrite_thread_note
# を一度も呼ばずファイル152件をRead、ソフト警告を「まとめて回答せよ」と
# 素直に解釈して数万字の調査結果をそのまま最終回答に書き出した）。
# ツール呼び出し自体は引き続き許可すること（write_thread_noteの呼び出しを
# 禁止するとかえって目的に反する）。configparserの仕様上、改行を含めたい
# 場合は次の行を空白でインデントして継続行として書ける。
token_guard_soft_warning_text = [**システム通知: このタスクのトークン使用量が上限に近づいています。これ以上の新規調査は行わず、まだwrite_thread_noteに書いていない事実があればここで書き出してから、次の応答は結論の要約とtopic名の参照に留めて簡潔に回答してください**]

# --- 空応答ガード ---
# dispatch_agent内のLLM応答が tool_calls も本文も空（LLMサーバー側の異常
# 応答）だった場合、これを正常終了とみなして空文字列を返してしまうと、
# それまでの調査結果が丸ごと握りつぶされて委譲元に何も伝わらない
# （本番incident・2026-07-23参照）。この回数まで再試行し、それでも空の
# 応答が続く場合のみ、それまでに集めたツール実行結果を要約して打ち切る。
empty_response_max_retries = 2

# --- dispatch_agent のバックグラウンドジョブ機構用設定 ---
# dispatch_agent のジョブが終了後、check_dispatch_agent_job で
# 一度も取得されないまま registry に残ってよい秒数。超過分は次回の
# dispatch_agent 呼び出し時に破棄される
# （[scripts].background_job_retention_seconds と同じ方式）。
background_job_retention_seconds = 120
# check_dispatch_agent_job が「実行中」ステータスを返した直後、同じジョブへの
# 次の check_dispatch_agent_job 呼び出しを許可するまでの最短間隔秒数。
# サブエージェントの1反復はLLM呼び出しを伴い[scripts]のスクリプト実行より
# 単位時間あたりの状態変化が乏しいため、既定値は[scripts]側と同じにしておく。
# 0以下を指定すると強制を無効化する。
background_min_poll_interval_seconds = 60
# 上記の最短間隔未満で check_dispatch_agent_job が呼ばれた際に、拒否の代わりに
# LLMへ返すメッセージ。空欄なら組み込みの既定文言を使う。プレースホルダーは
# [scripts].background_min_poll_message と同じ
# （{wait_remaining}/{job_id}/{min_interval}）。
background_min_poll_message =
# dispatch_agent のツール呼び出しが、ジョブ完了をこの秒数まで
# LLMを介さずコード側で待つ（Chainlit UI上はターンがブロックされたまま
# 「実行中」表示が続く）。この秒数を超えてもまだ実行中の場合のみ、
# job_id を返してLLMへ制御を戻す（フォールバック。以降は check_dispatch_agent_job
# で確認する）。ジョブ自体はこの上限に達してもキャンセルされず裏側で動き続ける。
# 0以下を指定すると無期限待ちになり、この安全上限フォールバック自体が
# 発生しなくなる（job_id が返ることはなく、check_dispatch_agent_job/
# stop_dispatch_agent_job も実質使われなくなる）。取りやめたい場合は
# Chainlitの停止ボタンを使う（内部のジョブも確実に終了させられる）。
background_inline_wait_max_seconds = 0
# 上記の待機中、人間向けに経過秒数・反復回数・進捗メモ末尾をチャットへ直接
# 送る間隔（秒）。cl.Message送信のみでLLM呼び出しを伴わないためトークンは
# 消費しない。
background_progress_push_interval_seconds = 20
# dispatch_agent 実行中のLLM呼び出しが [llm].request_timeout_seconds/
# stream_chunk_timeout_seconds に達した場合、または通信エラー（接続失敗・
# 5xx・httpx系）を検知した場合、直近使用した接続先を一時的にクールダウン
# した上で（sub_routing_strategy=priority_failoverの場合のみ次点の接続先へ
# 切り替わる）モデルを再構築してから同じ反復をこの回数までリトライする
# （ThinkingLoopDetectedの再構築リトライと同じ方式）。ジョブ自体は
# バックグラウンドタスクとして裏側で動き続けるため、1回のタイムアウトで
# 数百件分の進捗を丸ごと諦めるのではなくリトライが妥当。メインエージェント
# 側は [graph].connection_error_max_retries を使う。
background_llm_timeout_max_retries = 3

[user_response_timeouts]
# ユーザーの応答待ち（Chainlit の cl.AskActionMessage/cl.AskUserMessage）の
# タイムアウト秒数。いずれも未応答の場合は安全側に倒す（承認系はタイムアウト、
# 質問系はエラー扱い）。[scripts].timeout（スクリプト/コード自体の実行タイムアウト）
# とは別物。
# create_plan で作った計画への承認（approve_plan）の待ち時間
# （変更経緯は evals/tuning_log.md 参照）。0 を指定すると無期限待ちになる。
approval_seconds = 0
# AskUserQuestion（自由記述の質問。labels省略時は単発質問、labels指定時は
# 複数項目フォーム）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_question_seconds = 0
# ask_user_choice（選択肢形式の質問）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_choice_seconds = 0

[plan]
# 送信ボタン付近に表示する Plan Mode / Edit Automatically バッジを
# クリックしたときの挙動。
# true : 双方向切り替え可能（Plan Mode → Edit Automatically も含む）。
#        approve_plan によるユーザー承認プロセスを経ずに、クリック一発で
#        書き込み系ツールのロックを解除できる。
# false: Edit Automatically → Plan Mode への一方向のみ許可（ロックする
#        方向のクリックのみ有効）。Plan Mode → Edit Automatically への
#        解除はバッジのクリックでは行えず、必ず approve_plan（LLM経由の
#        ユーザー承認フロー）を通す必要がある。双方向切り替えで弊害が
#        出た場合の安全弁として false に変更する。
allow_badge_unlock = true
# approve_plan の承認をユーザーへ確認せず自動で行うかどうか。
# true : approve_plan が呼ばれた時点で承認/却下ボタンの表示・応答待ちを
#        一切行わず、その場で自動的に承認済み扱いにする。以後
#        run_script/run_script_background/execute_python_code/
#        execute_python_code_background のハードブロックが人の確認なしに
#        解除される。信頼できる自動化用途（無人バッチ実行等）以外での
#        使用は推奨しない。
# false（既定）: 従来通り、承認/却下ボタンを表示してユーザーの明示的な
#        応答を必須にする。
auto_approve = false

# create_plan を呼んだ時点で、既に Edit Automatically（計画承認済み）状態
# だった場合の挙動。
# true : 常に Plan Mode へ強制的に戻す（既定・従来挙動）。承認済みの計画が
#        あっても create_plan を呼び直すたびに plan_approved が無条件で
#        リセットされ、approve_plan による再承認が必須になる。
# false: 既に承認済みだった場合はそのまま Edit Automatically を維持し、
#        新しい steps だけを差し替える（approve_plan を再度呼ばなくても
#        書き込み系ツールを続行できる）。計画未承認の状態から呼んだ場合は
#        true/false に関わらずこれまで通り Plan Mode のまま（approve_plan
#        が必要）。承認済み計画の途中で create_plan を呼び直す運用が多く、
#        そのたびの再承認が過剰だと感じる場合に false へ変更する。
reset_approval_on_recreate = false

# 新しいユーザーメッセージを受け取るたびに、plan_approved を無条件で
# Plan Mode（未承認）へ戻すかどうか。
# true : 常に戻す（既定・従来挙動）。計画承認は「そのユーザーメッセージへの
#        応答で作られた計画の実行」に限定されるスコープとみなし、放置された
#        古い計画が次のメッセージへ持ち越されないようにする安全策。
# false: 承認済み状態をメッセージをまたいで維持する。thinking_loop_guard が
#        リトライ上限に達して打ち切られ、ユーザーが「続けて」等の新しい
#        メッセージを送って同じタスクを継続する場合でも、承認済みの計画を
#        create_plan/approve_plan からやり直させられずに済む。無関係な
#        新規依頼を送った際も前回の承認状態が残ってしまう点に注意。
reset_approval_on_new_message = false

# create_plan を呼ぶ前に、同一ターンで dispatch_agent(agent_type="planner")
# が完了していることを必須にするか。
# true : 未実施のまま create_plan を呼ぶとエラーを返しブロックする（既定）。
#        システムプロンプトが規定する5ステップ（調査→設計→create_plan→
#        approve_plan→update_task_progress）のうち「設計」段階
#        （planner委譲）がプロンプト指示のみでは省略される事例が本番で
#        確認されたため、create_plan→approve_plan の順序強制
#        （_guard_awaiting_approve_plan）と同じ考え方でコード側でも強制する。
#        create_plan が成功するたびにフラグは消費されるため、同一ターン内で
#        create_plan を複数回呼び直す場合はその都度 planner を呼び直す必要がある。
# false: 強制しない（旧来の挙動。planner委譲を省略して create_plan を直接
#        呼べる）。
require_planner_dispatch = true

[thinking_loop_guard]
# LLM応答（thinking/本文）のストリーミング中に反復ループ（同一の文・コード
# ブロックがほぼそのまま繰り返される暴走）を検知したら、生成を打ち切って
# 注意メッセージを注入し再試行する機能の設定。[llm].dry_multiplier（サーバー側
# のDRYサンプラー）で大幅に抑制されるが、完全には無くならない残存リスクへの
# アプリ側（クライアント側）の安全網。
enabled = true
# 判定対象とする直近テキストのウィンドウ文字数。
window_chars = 2000
# このバイト数増えるごとに再チェックする。
check_interval_chars = 150
# 上記条件が連続で何回成立したら確定でループと判定するか（誤検知防止）。
confirm_count = 2
# 周期に依存しない反復検知。直近window_chars文字が、それより前の履歴
# （最大max_history_chars文字に制限）の中にどれだけ長く一致する部分文字列を
# 持つかを、difflib.SequenceMatcher.find_longest_match()で動的に測定する。
# 比較対象とする過去履歴の上限文字数。大きいほど長い周期の反復も検知できるが
# 計算コストが増える（変更経緯は evals/tuning_log.md 参照）。
max_history_chars = 4000
# match_ratio（直近ウィンドウとの最長一致長/window_chars）がこの値を
# 上回ったら「反復的」の候補とみなす（変更経緯は evals/tuning_log.md 参照）。
match_ratio_threshold = 0.4
# ループ検知後、注意メッセージを注入して再試行する最大回数
# （メイングラフ・サブエージェントで共通）。
# 下の empty_response_max_retries とは独立に消費される（src/graph.py の
# ainvoke_ensuring_final_text 参照）。大量ファイル処理のように1ターンで
# LLM呼び出しが数十〜数百回に及ぶタスクでは、序盤と終盤で独立した失敗が
# 起きうるため、少し余裕を持たせている（変更経緯は evals/tuning_log.md iter41）。
# 複雑・情報量の多いタスクで思考がトークン上限に達して打ち切られるケースにも
# nudge_messages側の4件目（情報を分割し段階を踏んで考えさせる文言）で対応する
# ため、3から4へ増量。
max_retries = 6
# ループ検知後に注入する注意メッセージ（JSON/Python風のリスト（配列）形式で指定）。
# リトライ1回目には1つ目、2回目には2つ目…の順で使う。用意した数より
# リトライ回数が多い場合は、以降はランダムに選ぶ（同じ文言の繰り返しで
# 同じ堂々巡りを誘発しないため）。空リスト[]なら組み込みの既定文言を使う。
nudge_messages = [
    "直前の応答は同じ内容を繰り返すループに陥ったため打ち切りました。落ち着いて、今のタスクの続きを行ってください。",
    "直前の応答は同じ内容を繰り返すループに陥ったため打ち切りました。落ち着いて、今のタスクの続きを行ってください。",
    "**落ち着いて！！** また同じ検討が繰り返されています。冷静になって今のタスクの続きを行ってください。",
    "**落ち着いて！！** また同じ検討が繰り返されています。冷静になって今のタスクの続きを行ってください。",
    "**またループしてる！！落ち着いて！！** まだ同じ検討が繰り返されています。冷静になってまず今できることを１ステップ試して！そしてその試した内容が今までの流れから本当に正しいか確認してから続けて！",
    "**おーい！指示を聞け！！** 何回同じ事を繰り返すの！？もうあなたではどうにもできない？できないなら、一息ついて状況をユーザーに説明して！！",
    ]
# 無言終了（tool_calls も本文も空のAIMessage）を検知した場合に、最終回答を
# 促して再試行する最大回数（メイングラフ・evalハーネスで共通。旧実装は
# app.py内にハードコードされていたが、上のmax_retriesと対になる兄弟設定の
# ためここに置く）。上の max_retries とは独立に消費される（全体の試行回数は
# 両者の合計+1が上限）。ローカルモデルはツール呼び出しのXMLを本文へ書いて
# しまい空応答になることが散発的にあり、再試行すれば直ることが多いため
# （変更経緯は evals/tuning_log.md iter41）。
# 実測（2026-08-01、100枚レシピケース）で、create_plan/approve_plan/
# update_task_progress のような状態確認だけのツール結果の直後に空応答が
# 立て続けに3回発生し、後半の実作業まで進んだ時点で予算切れとなって最終回答が
# 空のまま終わった事例があった。1回あたりのコストは低い（空応答からの
# リトライは即座に完了する）ため、序盤の消費に余裕を持たせる目的で増量した。
empty_response_max_retries = 5

[context_trim]
# メインエージェント（src/graph.py）だけでなく、サブエージェント
# （dispatch_agent、src/subagent.py の run_subagent）にも同じ設定値が
# 一律に適用される（メイン/サブで機能の有無を分けないClaude Code方式）。
# 長いReActループ（ファイル読み込み等のツール呼び出しを繰り返すタスク）で、
# サイズ上限のないツール実行結果（例: OCR結果のMarkdown全文）が ToolMessage
# としてそのまま会話履歴に蓄積し続け、llama.cppへのプロンプトプリフィルが
# 極端に遅くなる問題への対策。直近の ToolMessage 以外は content を切り詰めて
# LLMへの入力だけを絞り込む（会話履歴自体は書き換えない。src/context_trim.py
# 参照。変更経緯は evals/tuning_log.md 参照）。
enabled = true
# トリムを発動させる閾値（Claude API の context editing、
# clear_tool_uses_20250919 の trigger.value 相当）。直近1回のLLM呼び出しの
# total_tokens がこの値未満のうちはトリムを発動しない（会話が短いうちは
# 切り詰めない）。0以下を指定すると常に発動する（この閾値機能が無かった
# 旧来の挙動と同じ）。[llm].track_token_usage=false 等で total_tokens を
# 取得できない場合は、閾値未到達とみなし発動しない点に注意。
trigger_total_tokens = 85000
# 全文保持する直近 ToolMessage の件数。これより古い ToolMessage のみ切り詰め対象。
keep_recent_tool_messages = 20
# 切り詰め対象 ToolMessage / AIMessage の content を、先頭何文字まで残すか
# （超過分はマーカー文言に置換）。
truncated_max_chars = 1000
# Read/Glob/Grep/json_query/analyze_image（[file_tools_duplicate_guard]の
# 対象ツール。同一引数での再呼び出しに上限回数がある）の ToolMessage にだけ
# 適用する切り詰め文字数（truncated_max_chars の代わりに使う）。これらの
# ツールは上限到達時「会話履歴にある前回の実行結果を参照してください」と
# 案内するが、前回結果が truncated_max_chars（プリフィル短縮のため小さめ）
# で切り詰められていると、実際にはモデルへ渡っていない分を参照させることに
# なり案内が機能しない。そのため別枠でより大きい値を持たせる。
duplicate_guard_tool_max_chars = 2000
# ToolMessage だけでなく AIMessage（モデル自身の思考本文と tool_calls の引数）も
# 切り詰めるか。execute_python_code の code 引数へファイル本文を書き写すような
# 使い方をすると、ToolMessage 側だけを絞っても1リクエストあたりの入力が膨らみ
# 続けてコンテキスト上限に張り付くため、既定で有効
# （変更経緯は evals/tuning_log.md 参照）。tool_calls の id/name と件数は
# 変更しないため、ToolMessage との対応関係は壊れない。
trim_ai_messages = true
# 全文保持する直近 AIMessage の件数。これより古い AIMessage のみ切り詰め対象。
keep_recent_ai_messages = 5

[context_compaction]
# ClaudeCodeのcompact相当。次の2条件のいずれかを満たしたら、古い会話履歴を
# LLM自身に要約させ、永続履歴（checkpointer上のメッセージ）自体を圧縮する
# （src/context_compaction.py 参照）:
#   1. メインエージェントの累積トークン数（token_usage_cumulative_main、
#      圧縮が発火するたびに0へリセットされる）が token_threshold を超えた。
#   2. 直近1回のLLM呼び出しの total_tokens が
#      single_request_token_threshold を超えた。
# 累積条件だけだと、[context_trim]による送信ペイロード削減の影響で直近
# リクエスト単体のトークン数は閾値未満に収まり続け、圧縮が発火しないまま
# 永続履歴だけが肥大化し、いざ発火した際の要約LLM呼び出し自体がコンテキスト
# 長超過を起こしうる。逆に単発条件だけだと、1ターンで巨大なツール結果や
# ファイル内容を積まない限り会話が長引いても発火しない。そのため両方を見る。
# [context_trim]は「今回の入力だけを縮める・永続履歴は書き換えない」方針だが、
# こちらは永続履歴自体を縮めるため、会話が長引くほど効くプリフィル遅延・
# トークン量への恒久対策になる。
# [context_trim]と同様、サブエージェント（dispatch_agent）のローカル履歴にも
# 同じ設定値が一律に適用される。ただし「累積トークン数」の起点はメインと
# サブで別物（メイン=スレッド全体の累積、サブ=個々のdispatch_agent呼び出し
# 1回の中だけの累積。発火のたびに0へリセットされるのは共通）。
enabled = true
# メインエージェントの累積 total_tokens がこの値を超えたら圧縮する
# （圧縮発火のたびに0へリセットされるため、「圧縮1サイクルあたりの
# 累積上限」を意味する。1リクエストあたりの上限ではない点に注意）。
token_threshold = 99999999999
# 直近1回のLLM呼び出しの total_tokens がこの値を超えたら圧縮する。
# 低パラメータモデルでは1リクエストあたりcontext window未満に収める必要が
# あるため、ツール結果1往復分の余裕を見てそれより低い値にすること。
single_request_token_threshold = 90000
# 圧縮時に丸ごと保持する直近のユーザーターン数。
# 構造ベース（発行済み tool_call id と返却済み ToolMessage id の一致）で
# 安全な切断点を探し、その位置で古い側を要約対象として切り離す。
keep_recent_turns = 3
# 会話全体のメッセージ数がこの件数未満なら、閾値を超えていても圧縮しない
# （短い会話で無駄に要約を走らせない安全弁）。
min_messages_to_compact = 10
# 要約を指示するプロンプト本文（Markdown）のパス。
compaction_prompt_path = ./system_prompt/compaction_prompt.md
# 要約対象の古い ToolMessage を要約LLMへ渡す前に切り詰める文字数
# （要約プロンプト自体のプリフィルが遅くならないようにするため）。
# [context_trim].truncated_max_chars とは別枠。要約は永続履歴を置き換える
# 恒久的な操作のため、[context_trim]と同じ小さめの値を使うと要約対象の
# ツール結果がまとめて情報欠落し、要約が内容の薄いものになりうる
# （例: 大量ファイル処理タスクでファイル名の列挙しか残らない）。
summary_source_max_chars = 3000
# 圧縮（要約）が発火する前に、write_thread_noteへまだ書いていない重要な
# 事実（値・件数・該当箇所等）があれば書き出すよう促す注意メッセージを
# 注入する閾値（直近1回のLLM呼び出しのtotal_tokens基準）。要約はLLM自身に
# 行わせるため、要約対象から外れる古い会話中の具体的な事実が薄まって
# 失われうる。write_thread_noteはファイルへの追記であり要約の影響を受けない
# ため、失われる前に退避させる狙い（src/context_compaction.py の
# maybe_append_precompact_note_nudge）。single_request_token_threshold より
# 十分小さい値にすること（注入後、実際に圧縮が発火するまでの「次の1応答」で
# write_thread_noteを呼ぶ余地を残すため）。0以下を指定するとこの機能を
# 無効化する。[graph].token_guard_soft_threshold（会話全体を打ち切って
# 新しいチャットへの引継ぎを促す完全な打ち切り）とは別物で、こちらは
# 会話を止めずに注意喚起するだけの軽いフック（両方が同時に発動する場合は
# 引継ぎ側を優先し、こちらは差し込まない。「ツールを呼ぶな」と
# 「write_thread_noteを呼べ」が矛盾するため）。
# 注意: この閾値を超えている間、毎ターン無条件でこのメッセージを注入すると、
# メインエージェントが同じ内容のnoteを書き直し続ける実質的な無限ループに
# なる（2026-08-22に実機ログで確認済み。約5.5分間でwrite_thread_noteが
# 11回以上連続実行された）。そのため実装では「直近keep_recent_turnsターン
# 以内にwrite_thread_noteが既に呼ばれていれば再注入しない」判定
# （_write_thread_note_called_recently）を挟んでおり、keep_recent_turnsを
# 使い回している（新しい設定値を増やさないため）。keep_recent_turnsを
# 変更するとこの再ナッジ抑制の範囲も連動して変わる点に注意。
pre_note_threshold = 80000
# 上記閾値到達時に注入する注意メッセージの文言。write_thread_noteへの
# 書き出しを促す内容にすること。configparserの仕様上、改行を含めたい場合は
# 次の行を空白でインデントして継続行として書ける。
pre_note_warning_text = [**システム通知: まもなくコンテキスト圧縮（古い会話履歴の要約）が行われます。要約後は書き出していない事実が失われるおそれがあるため、write_thread_noteにまだ記録していない重要な事実（値・件数・該当箇所等）があれば、次の応答でツールを呼ぶ前に書き出してください**]

[auth]
# ログイン認証機能のON/OFF。
# false（既定）: ログイン不要（現状通り、誰でもそのまま使える）。
# true          : 起動時にログイン画面が表示され、.env の AUTH_USERS に登録した
#                 ユーザー名/パスワードでのログインが必須になる。
# ユーザー名・パスワードの実体、および必須の CHAINLIT_AUTH_SECRET は
# .env（環境変数）側で管理する（機密情報は config.ini に置かない方針のため、
# ここには ON/OFF フラグのみを置く。詳細は .env.example / README.md 参照）。
enabled = false
# enabled=true のときのパスワード必須/不要の切り替え。
# true（既定） : ユーザー名とパスワードの両方が .env の AUTH_USERS の登録内容と
#                完全一致しないとログインできない。
# false        : ユーザー名さえ AUTH_USERS に登録済みであれば、パスワードは
#                何を入力しても（空でも）ログインできる。社内LAN等、ネットワーク
#                到達性自体で十分に閉じており、ユーザー名だけで作業者を区別・
#                記録できれば足りる環境向けの緩和スイッチ。
require_password = false

[checkpointer]
# LangGraphの会話状態を永続化するSQLite接続（aiosqlite、[paths].checkpoint_db）
# 周りのタイムアウト設定。DB接続切れエラー（issue.md「DB接続切れエラー
# （no active connection）」参照）の対策として導入。
# checkpointer操作（aget_tuple/aput_writes等）1回あたりのタイムアウト秒数。
# aiosqliteのバックグラウンドスレッドが固着すると内部ロックが永久に解放
# されず全操作がハングするため、この秒数で切り上げて _CheckpointerTimeout
# を送出し、checkpointer再構築（下記2値も参照）へフォールバックする
# （app.py の _TimeoutGuardedSqliteSaver._guarded 参照）。
op_timeout_seconds = 15
# checkpointer再構築時、旧DB接続をクローズする際のタイムアウト秒数。
# 旧接続のクローズが固着しても新接続への切り替え自体はブロックしない
# （超過時はログのみでリークを許容する。app.py の _rebuild_checkpointer 参照）。
close_timeout_seconds = 3
# アプリシャットダウン時、保留中の非同期タスク（on_messageのストリーム処理等）
# の完了を待つ最大秒数。この秒数を過ぎてもなお残っているタスクはキャンセル
# してから後始末の完了を待ち、その後にDB接続を閉じる。先に接続を閉じてしまうと
# 保留タスクのcheckpointer操作が ValueError: no active connection で失敗する
# ため、必ずこの順序を守る（app.py の _close_checkpointer_gracefully 参照）。
shutdown_drain_timeout_seconds = 5

[mcp]
# .locohane/settings.json の mcpServers に定義された全MCPサーバーへの
# 自動接続機能そのものの有効/無効。false ならファイルの有無に関わらず
# 一切接続しない（.locohane/settings.json の "mcp"."enabled" があればそちらが
# 優先。ここは settings.json に指定が無い場合のデフォルト値）。
enabled = true
# .locohane/settings.json のパス（相対パスはプロジェクトルート基準）。
# Claude Code / Qwen Code の mcpServers 設定形式を参考にした、stdioトランスポート
# 専用のMCPサーバー接続設定ファイル（src/mcp_client.py 参照）。
settings_path = ./.locohane/settings.json
# 1サーバーあたりの起動（プロセス起動 + initialize + tools/list）のタイムアウト
# 秒数。超過したサーバーは接続失敗として扱いスキップする（アプリ起動は継続する）。
connect_timeout_seconds = 15
# MCPツール（tools/call）1回あたりのタイムアウト秒数。
call_timeout_seconds = 60

[ui]
# チャット画面（フロントエンド）のメインスレッドに描画するメッセージ
# （ユーザー発言/AI応答、cl.Message のステップ単位）の最大件数。
# 上限を超えた古いメッセージは画面表示から切り捨てられるだけで、
# LLMへ渡す会話コンテキストや会話ログ（[chat_log]）には一切影響しない
# （表示専用の間引き。frontend/src/App.tsx 参照）。
# 0 を指定すると無制限（従来どおり全件描画）。
max_display_messages = 50
# サイドパネル（右側、ツール呼び出し等のStep一覧）に描画するStepの最大件数。
# 上限を超えた古いStepは画面表示から切り捨てられるだけで、LLMへ渡す
# 会話コンテキストや会話ログには一切影響しない（表示専用の間引き）。
# 0 を指定すると無制限（従来どおり全件描画）。
max_display_side_steps = 50

# --- トークン使用量カードの強調表示 ---
# サイドパネルの「トークン使用量」カードで、「リクエスト1回あたり」行
# （直近1回のLLM呼び出し分。累計行は対象外）の合計トークン数（total）が
# この値以上になったら、行全体をオレンジ太字で強調表示する。あくまで
# 表示専用の警告であり、[llm].max_tokens等の実際の生成上限には影響しない。
# 0以下を指定すると無効化する。
token_usage_warn_threshold = 48000
# 上記と同じ判定対象（「リクエスト1回あたり」行の合計トークン数）が
# この値以上になったら、行全体を赤太字で強調表示する
# （token_usage_warn_threshold より優先。0以下を指定すると無効化する）。
token_usage_alert_threshold = 64000

[websocket]
# ブラウザ⇔サーバー間のWebSocket（Socket.IO）接続の生存確認間隔・タイムアウト。
# [llm].stream_chunk_timeout_seconds（LLMサーバーとの通信タイムアウト）とは
# 別レイヤーの設定で、chainlit本体（chainlit/server.py の
# `socketio.AsyncServer(...)`）はこれらを指定していないため、未設定時は
# python-socketio/engineioのデフォルト（25秒間隔・20秒タイムアウト）が使われる。
# LLM応答待ちでイベントループがブロッキング気味になる時間帯（dispatch_agentの
# 長時間実行中など）に20秒のping_timeoutを超えると、バックエンド処理自体は
# 継続しているにもかかわらずWebSocketが切断され、再接続までStep更新がUIの
# タイムライン（サイドパネル）に反映されない不具合が起きうる
# （2026-08-28 ユーザー報告、ターン進行中の切断が短時間に連発した実例）。
# サーバーが何秒間隔でpingを送るか。
ping_interval_seconds = 25
# 直近のpingへの応答（pong）をこの秒数待っても受信できない場合に切断とみなす。
# 値を大きくするほど瞬断・応答遅延に強くなるが、本当に接続が死んだ場合の
# 検知が遅れる（その間はメッセージ送達不可のまま残る）。
ping_timeout_seconds = 60
