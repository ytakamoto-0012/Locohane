# ============================================================================
# Locohane 設定ファイル
#
# すべての接続先・保存先パスをこの1ファイルに集約する（透明性最優先）。
# 各値は環境変数で上書き可能（対応する環境変数名は src/config.py を参照）。
# ============================================================================

[llm]
# --- メインエージェント用の接続先 ---
# llama.cpp server（llama-server）の OpenAI 互換エンドポイント。複数指定した
# 場合は main_routing_strategy に従って呼び出しごとに選ぶ（1件のみなら常に
# それを使う）。1接続先 = {"base_url":..., "api_key":..., "model":...} の
# dict。JSON/Python風リスト形式（角カッコ＋改行複数行OK、末尾カンマ許容。
# [thinking_loop_guard].nudge_messages と同じ記法）で指定する。
#   base_url: 例 http://localhost:8080/v1
#             （例: llama-server --host 127.0.0.1 --port 8080）
#   api_key : llama.cpp は認証不要のためダミー値でよい（空だとクライアントが
#             弾くため何か入れる）。省略時は "dummy-not-used"。
#   model   : llama-server の --model / --alias に合わせて切り替える。
#   start/end: この接続先を使用可能にする時間帯（任意）。単位は時間(H)、
#             分は小数で指定する（例: 9.5 = 9:30、22.25 = 22:15）。
#             start/end は必ずセットで指定する（片方だけの指定は不可）。
#             両方省略すると常時使用可能になる。start > end の場合は日を
#             またぐ範囲として扱う（例: start=22, end=6 なら22:00〜翌6:00）。
#             リスト全体で最低1件は start/end を両方省略した「常時使用可能」
#             な接続先が必要（どの時間帯にも当てはまらない瞬間が生じないよう
#             にするため）。時間帯外の接続先しか無い瞬間は、常時使用可能な
#             接続先（無ければ全接続先）から選ばれる。
#    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B"},
#    {"base_url": "http://localhost:12431/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B", "start": 22, "end": 6},
main_url = [
    {"base_url": "http://localhost:12430/v1", "api_key": "dummy-not-used", "model": "QWEN3.6_35B-A3B"},
    ]
# main_url が複数ある場合の選び方。
#   round_robin      : 呼び出しごとに順番に回す
#   random            : 呼び出しごとにランダムに選ぶ
#   priority_failover : 常に先頭を使い、通信エラー検知時のみ次点へ一時的に切り替える
#   sticky            : 会話(thread_id)単位で常に同じ接続先に固定する
#                       （llama.cppはプロンプト先頭が同じだとKVキャッシュが
#                       効いて高速化するため、同一会話は同じサーバーに固定
#                       すると有利）。新しい会話が接続先を選ぶ最初の1回だけ、
#                       他のどの会話も固定していない空き接続先を優先する
#                       （空きが無ければ従来通りハッシュで選び、複数会話が
#                       同じ接続先に同居することを許容する）。一度固定した
#                       接続先は、その会話が終了する（タブを閉じる等）まで
#                       変わらない。
main_routing_strategy = round_robin

# --- サブエージェント（dispatch_agent）用の接続先 ---
# main_url と同じ形式・既定値。メインエージェントとは別のllama-server
# インスタンス／別モデルへ振り分けたい場合にここを変更する。
# 未指定（キー無し、または値を空にする）の場合は main_url をそのまま使う。
sub_url = 
sub_routing_strategy = round_robin

# --- 生成パラメータ（main/sub共通） ---
# 生成のばらつき（0.0〜）。ツール呼び出しの安定性を優先し低めに設定
# （変更経緯は evals/tuning_log.md 参照）。
temperature = 0.6
# 累積確率上位のみサンプリングする閾値（0〜1）。空欄なら未指定（llama-server既定に委ねる）。
top_p = 0.95
# 上位k候補のみサンプリングする（llama.cpp拡張、OpenAI標準APIには無い）。空欄なら未指定。
top_k = 20
# 直近生成トークンの再出現を抑制する係数（llama.cpp拡張、1.0=無効、1.1前後で軽く抑制）。
# 空欄なら未指定。thinking（<think>ブロック）内で同じ文言を繰り返すループの抑制に
# 直接効くが、ファイルパス等の反復文字列の生成精度とトレードオフの関係にあるため、
# ループ抑制自体は thinking_loop_guard（アプリ側の検知+リトライ）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
repeat_penalty = 1.0
# 出現済みトークン全体への一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
frequency_penalty = 0
# 一度でも出現したトークンへの一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
presence_penalty = 0
# 1リクエストあたりの最大生成トークン数。空欄なら無制限（llama-server既定に委ねる）。
# thinkingの暴走で応答が返らなくなるケースの歯止めにもなる。
max_tokens = 32000
# --- DRY (Don't Repeat Yourself) サンプラー（llama.cpp拡張） ---
# repeat_penalty より長いフレーズ単位の反復（thinking内で同じ文を繰り返す等）に
# 強く効く。0.0 または空欄で無効。ファイルパス等の反復文字列の生成精度との
# トレードオフがあるため、暴走対策は[thinking_loop_guard]（アプリ側の検知+
# リトライ）と[llm].max_tokens=128000（最終的な歯止め）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
dry_multiplier =
# 反復長に対するペナルティの指数増加率（既定 1.75 相当）。空欄なら未指定。
dry_base =
# この文字数以下の反復は許容する（既定 2 相当）。空欄なら未指定。
dry_allowed_length = 
# 反復検出に遡って見るトークン数（-1 でコンテキスト全体、既定 -1 相当）。空欄なら未指定。
dry_penalty_last_n = 
# 反復検出をリセットする区切り文字（カンマ区切りで複数指定、例: 改行,:,",*）。
# 空欄なら llama-server 既定（改行・:・"・*）に委ねる。
dry_sequence_breakers =
# Qwen3系モデルの thinking（reasoning、<think>ブロック）モードのON/OFF
# （llama.cpp拡張、extra_body の chat_template_kwargs 経由で送る）。
# 空欄なら未指定でモデル・llama-server既定に委ねる。false にすると reasoning
# をオフにする（応答速度は上がるが、複雑なタスクの精度は落ちる可能性がある）。
enable_thinking = true
# thinkingタグ（<think>...</think>）の扱い方（llama.cpp拡張、extra_body 経由で
# 送る。llama-server起動時の --reasoning-format FORMAT と対応する値）。
#   none            : パースせず <think> タグを含めたまま message.content に残す
#   deepseek        : 思考部分を message.reasoning_content に分離して格納する
#                     （本アプリの ChatLlamaCpp はこの形式を前提に
#                     reasoning_content を拾い上げてUIの思考表示に使っている。
#                     src/llm.py の ChatLlamaCpp docstring参照）
#   deepseek-legacy : <think> タグを message.content に残しつつ、
#                     message.reasoning_content にも入れる（旧DeepSeek API互換）
# 空欄なら未指定（llama-server既定の auto ＝テンプレートから自動判定に委ねる）。
reasoning_format = deepseek
# 思考（thinking）に使えるトークン数の上限（llama.cpp拡張、extra_body 経由で
# 送る。llama-server起動時の --reasoning-budget N と対応する値）。
# -1 = 無制限、0 = 即座に思考を終了、N>0 = そのトークン数を上限にする。
# 空欄なら未指定（llama-server既定の -1＝無制限に委ねる）。
reasoning_budget =
# 上記 reasoning_budget を使い切った際に、思考終了タグの直前に挿入する
# メッセージ（llama.cpp拡張、extra_body 経由で送る。llama-server起動時の
# --reasoning-budget-message MESSAGE と対応する値）。空欄なら挿入しない
# （llama-server既定）。
reasoning_budget_message =
# トークン使用量（入力/出力/合計）を取得するかどうか。true にすると
# ChatOpenAI の stream_usage=True が有効化され、Chainlit UI とeval結果に
# トークン数が表示される。llama-server が stream_options.include_usage
# 拡張に未対応でエラーになる場合のみ false にする。
track_token_usage = true
# ==== request_timeout_seconds と stream_chunk_timeout_seconds の関係 ====
# この2つは実装上「入れ子」になっている。langchain_openai の
# stream_chunk_timeout（下のstream_chunk_timeout_seconds）は、内側で
# httpxのread timeout（下のrequest_timeout_seconds）を待つ処理を
# asyncio.wait_forでラップしているだけで、独立に監視しているわけではない。
#   外側: asyncio.wait_for(..., timeout=stream_chunk_timeout_seconds)
#     内側: httpx read（timeout=request_timeout_seconds）
# そのためサーバーがまだ1バイトも返していない区間（＝プロンプト処理
# (prefill)が終わって最初のチャンクが届くまでの待ち時間）は、両方の時計が
# 同時に進む。つまり実際に待てる時間は
#   実効タイムアウト = min(request_timeout_seconds, stream_chunk_timeout_seconds)
# であり、片方だけ大きくしても、もう片方が小さければそちらが先に発火して
# タイムアウトする。数万トークン級の長いプロンプトを送るとprefillが長引く
# ため、両方ともprefill所要時間より十分大きい値にしておく必要がある。
# 「大きい方を上げれば安全」ではなく「小さい方が上限になる」点に注意。
#
# 実測に基づく推奨値の算出は tune-config-timeouts スキルを使うこと
# （evals/analyze_timing.py の算出式。数値が変わったらそちらが正）:
#   request_timeout_seconds      推奨値 = ceil(max_llm_total_seconds × 1.5)（下限60秒）
#   stream_chunk_timeout_seconds 推奨値 = ceil(max_stream_chunk_gap_seconds × 2.0)（下限30秒）
#
# LLMサーバーへの応答待ちタイムアウト秒数（read/write/pool。connectは別途
# 固定10秒）。上記の入れ子構造でいう「内側」＝httpxレベルで、生のバイトが
# ソケットに届く間隔を計測する最も低レベルのタイムアウト。read timeoutは
# チャンク間のアイドル時間の上限で、生成が続く限りチャンク到達のたびに
# リセットされるため、正常な長時間ストリーミングは妨げない（ただし
# ストリーミング開始前のprefill待ち中も時計は進んでいる点は上記参照）。
# ストリームの後始末失敗等でクライアントが壊れたまま次のリクエストが
# ハングし続ける異常事態を検知するための値（変更経緯は evals/tuning_log.md
# 参照）。
request_timeout_seconds = 300
# ストリーミング中にチャンクが一定時間届かない場合のタイムアウト秒数
# (langchain_openaiのstream_chunk_timeout)。上記の入れ子構造でいう「外側」＝
# request_timeout_secondsより一段上のアプリケーション層で、パース済み
# チャンク（SSEの1イベント）が届く間隔を計測する。「チャンクとチャンクの
# 間隔」の上限で、大きなコンテキストのプロンプト処理(prefill)に時間が
# かかる環境(CPU/GPU性能が低い、n-cpu-moeでCPUオフロードしている等)では、
# 生成開始までにこの秒数を超えてタイムアウトしやすい。上記の通り
# request_timeout_secondsも同時に効いているため、こちらだけ上げても
# request_timeout_secondsの方が小さければ意味がない。ライブラリ既定値は
# 120秒。
#
# P4 切り分け実験: この値を 0 に設定すると、langchain_openai 内の
# _astream_with_chunk_timeout で wait_for が無効化され、チャンク単位の
# asyncio.Task 生成（別タスク化）が止まる。これにより 2026-07-28 incident
# で確認された "Attempted to exit cancel scope in a different task" 等の
# RuntimeError が再現しなくなるか確認できる。request_timeout_seconds
# （P0-1 で実効化済み）が read timeout を担保するため、0 でも安全性は
# 損なわれない。実験終了後は元の値（300）へ戻す。
stream_chunk_timeout_seconds = 300
# llama-server への同時リクエスト数の上限。1 以上: asyncio.Semaphore(N) で
# ガードする（既定は 1＝完全直列化）。0 以下: ガード無効（無制限）。
# [graph].max_parallel と [subagent].max_parallel はそれぞれ「1セッションあたり」
# のツール呼び出し・dispatch_agent 並列数を制御する（セッション毎に独立した
# Semaphoreを持つ）のに対し、プロセス全体・全セッション合算で共有される
# llama-server の実スロット数（--parallel）への同時アクセス総数は、この値が
# 一元管理する。運用中の --parallel 値と揃えるのが安全。
max_concurrent_requests = 2

[paths]
# 各種データ保存先パスの共通ベースディレクトリ。[paths] 配下の
# checkpoint_db/memory_dir/plans_dir、および他セクション（[uploads]/[log]/
# [default_workdir]/[path_memory]/[chat_log]）の dir 系キーの値に
# ${common_data_dir} と書くと、ここで指定した値に置換される
# （configparser標準の補間機能ではなく、src/config.py の load_config() が
# 起動時に行う独自の文字列置換。セクションをまたいで使えるようにするための
# 仕組み）。保存先ルートをまとめて変更したい場合はここだけ変更すればよい。
# 対応する環境変数 COMMON_DATA_DIR で上書き可能（環境変数側の値は
# ${common_data_dir} プレースホルダーの展開対象にはならない。素のパスを
# 直接指定すること）。
common_data_dir = ./data
# スキル定義フォルダ（ここ配下の各サブフォルダの SKILL.md を起動時に走査する）。
skills_dir = ./skills
# エージェント種別定義フォルダ（skills_dir と同格。ClaudeCode の .claude/agents/*.md
# 相当）。ここ配下の各 *.md を dispatch_agent の agent_type 種別として起動時に走査する。
# 1ファイル = 1種別。frontmatterで name/description/tools を指定する
# （tools 省略時は既定のツール一式を継承する）。
agents_dir = ./agents
# プロジェクト固有の拡張ディレクトリ（ClaudeCode の .claude/ 相当）。
# 指定した各ディレクトリ配下の以下3つを起動時に自動検知する（いずれも存在しなくても
# エラーにはならない）:
#   skills/      - skills_dir に追加でマージ走査される追加スキル（同名スキルが
#                  両方に存在する場合はこちら側が優先される）
#   agents/      - agents_dir に追加でマージ走査される追加エージェント種別
#                  （同名定義が両方に存在する場合はこちら側が優先される）
#   LOCOHANE.md  - システムプロンプトの {{project_instructions}} へ差し込まれる
#                  プロジェクト固有の追加指示（ClaudeCode の CLAUDE.md 相当）。
#                  存在しなくてもエラーにはならない（「（プロジェクト固有の指示は
#                  ありません）」が差し込まれるだけ）。1ファイルあたり200行を
#                  超える場合は切り詰められる。
# 複数ディレクトリを指定したい場合は、[thinking_loop_guard].nudge_messages と同じ
# JSON/Python風リスト形式（角カッコ＋改行複数行OK）で指定する。指定順で後方の
# ディレクトリが優先される（skills/agents はマージ、LOCOHANE.mdは見出し付きで
# 連結。マージ・重複排除等は行わない）。例:
# project_locohane_dir = [
#     "./.locohane",
#     "./.locohane_team",
#     ]
project_locohane_dir = [
    "./.locohane",
    ]
# run_script/execute_python_code のサブプロセスへ渡す PATH の先頭に追加する
# ディレクトリ（外部バイナリ実行ファイルの配置先）。コマンド名を素の状態で叩く
# スキルは、OS側のPATH環境変数へユーザーが手動登録していないと「コマンドが
# 見つからない」で失敗する。ここに配置先を明示しておけば、evals・app.py実行時の
# どちらでも手動登録なしで呼び出せる（src/tools.py の _subprocess_env 参照）。
# project_locohane_dir と同じJSON/Python風リスト形式で指定する。存在しない
# ディレクトリは無視される。
bin_path = []

# システムプロンプトのテンプレートファイル（{{skills}} にスキル一覧を差し込む）。
system_prompt_path = ./system_prompt/system_prompt.md
# LangGraph の会話状態（チェックポイント）を溜める SQLite ファイル。
checkpoint_db = ${common_data_dir}/checkpoints.sqlite
# 永続メモリーの保存先（user/feedback/project/reference のサブフォルダと MEMORY.md 索引を持つ）。
memory_dir = ${common_data_dir}/memory
# create_plan が detail_markdown 引数を渡した際に書き出す、実行計画の詳細
# Markdownファイルの保存先。会話スレッドごとに1ファイルで、create_plan を
# 呼ぶたびに上書き更新される（任意機能のため空でもエラーにはならない）。
plans_dir = ${common_data_dir}/plans
# help ツールが読み込んで返すヘルプ本文（ユーザー向け、Markdown）。
help_path = ./system_prompt/help.md

[uploads]
# Chainlit へのアップロードファイルの保存先。
dir = ${common_data_dir}/uploads
# アップロードファイルの保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。
# 0 以下を指定すると自動削除を無効化する。
retention_days = 1
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chainlit_files]
# show_image（cl.Image添付）や、回答本文への画像埋め込み
# （app.py の _embed_local_images_as_session_urls）がブラウザへ配信する際に
# 使う、Chainlit自身のセッションファイルディレクトリ（プロジェクト直下
# .files/<セッションID>/。パスはChainlitが管理しており、ここでは変更
# できない）の自動削除設定。Chainlit自身にもブラウザ切断時の削除処理は
# あるが、プロセス再起動等では確実に働くとは限らないため、他の data/* 配下
# と同様に日数ベースの自動削除を保険として用意する。
# ディレクトリ単位（セッションID配下ごと）で削除する点が他セクションと異なる。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[images]
# 画像をLLMへ渡す前に縮小する際の、長辺のピクセル数の上限
# （analyze_image ツールと、ユーザーがアップロードした画像の両方に効く）。
# 「DPI」ではなく長辺ピクセル数で指定しているのは、スマホ撮影のJPEGはDPI
# メタデータを持たない/当てにならない一方、Visionモデルが消費するトークン量は
# 画素数でほぼ決まるため。値を下げるほど1回のサブエージェント委任で扱える
# 枚数が増えるが、写真に写り込んだ細かい文字は読み取りにくくなる。
# 0 を指定すると縮小しない（元の解像度をそのまま送る）。
# 画像の長辺が既にこの値以下の場合は再エンコードせず元データをそのまま使う。
max_long_side_pixels = 2048
# 縮小後に再エンコードするJPEGの品質(1-95)。文字が写り込んだ画像を読み取らせる
# 用途では下げすぎると判読できなくなるので85以上を推奨。
jpeg_quality = 85
# LLMの回答本文（Markdownテーブルのセル等）へ直接埋め込む画像プレビューの、
# 長辺ピクセル数の上限。上記 max_long_side_pixels（Vision向け）とは別の、
# 意図的に小さい値（app.py の _embed_local_images_as_session_urls が
# show_image と同じセッションファイル配信経路でブラウザへ渡す。セル内の
# サムネイル用途なので、表示帯域・ディスク使用量を抑える観点で小さめでよい）。
inline_preview_max_long_side_pixels = 320
# 上記サムネイルの再エンコード品質(1-95)。
inline_preview_jpeg_quality = 70

[default_workdir]
# エージェントの既定の作業ディレクトリ（run_script の cwd、スクリプトが生成する
# ファイルの出力先の基準になる）。作業フォルダアイコンで
# セッション単位の作業ディレクトリが指定されなかった場合に使われる。
dir = ${common_data_dir}/temp
# 上記 dir 直下に溜まり続けるファイルの保持日数。この日数を過ぎた（更新日時が古い）
# ファイルは自動削除する。0 以下を指定すると自動削除を無効化する。ユーザーが
# ChatSettings で指定したセッション単位の work_dir は対象外（dir のみが対象）。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[path_memory]
# パスメモリー（src/path_memory.py）が会話ごとのレジストリファイル
# （<thread_id>.json）を保存するディレクトリ。
dir = ${common_data_dir}/path_memory
# 保持日数。この日数を過ぎた（更新日時が古い）レジストリファイルは自動削除する。
# 「会話終了」を明示的に検知する手段が無いため、日数ベースで管理する。
retention_days = 1
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 1会話あたりの登録上限件数。
max_entries = 10000

[log]
# アプリログの出力先ディレクトリ。
dir = ${common_data_dir}/logs
# ログの詳細度。次の3値のいずれか:
#   info  - 現行仕様。各ツール呼び出しの概要（ツール名・要約引数）のみ記録する。
#   debug - info に加えて、ツール呼び出しの全引数・全結果、LLMの応答本文・
#           thinking（reasoning_content）まで記録する（情報量・ファイルサイズが
#           大きく増える。障害調査でモデルの挙動を忠実に追いたいときに使う）。
#           ※コンソールには一切出力されない（file_handler のみ）。
#           ※openai/httpx/httpcore/aiosqlite/asyncio 由来の DEBUG ログは抑制される。
#   none  - ログ出力を一切行わない（data/logs/app_*.log を含め何も生成しない）。
level = debug
# 起動のたびに新しい app_*.log ファイルを作成するか、直近の既存ファイルに
# 追記を試みるか（true/false）。
# false（既定）: 直近の app_*.log への追記を試みる（既に max_lines を
#                超えていれば、その場で新しいファイルにローテーションする）。
# true          : 起動のたびに必ず新しい日時つきファイルを作成する。
# level=none のときはログ自体を出さないため、このフラグは意味を持たない。
clear_on_startup = true
# app_*.log（上記 dir に出力されるアプリログ）1ファイルあたりの
# 最大行数。この行数を超えたら、新しい日時つきファイル名
# （例: app_20260725_143012.log）へローテーションする。
# ファイル名の日時はローテーションのたびに「今」の日時で付け直す
# （起動時刻固定ではない）。同一秒に複数回ローテーションする場合は
# _1, _2... の連番を付けて衝突を避ける。
# 1レコード（例外トレースバック等）が複数行になる場合はその全行をカウント
# するため、閾値は「ファイルの実際の行数」を指す。level=none のときは
# app_*.log自体を生成しないため意味を持たない。
max_lines = 5000
# ローテーションで増え続ける古い app_*.log の保持日数。この日数を過ぎた
# （更新日時が古い）ファイルは自動削除する。0 以下を指定すると自動削除を
# 無効化する。同じ dir に evals/run_case.py が書き出す evals.log は
# 別扱いのため削除対象に含まれない。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chat_log]
# 会話ログ（ユーザー発言とAIの最終応答）をテキストファイルへ記録する機能の有効/無効。
# false（既定）: 記録しない。
enabled = true
# 会話ログの保存先ルートディレクトリ。<dir>/<ユーザー名>/<日付>_<thread_id>.log の
