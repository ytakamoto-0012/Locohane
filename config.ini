    [["docx-read","read_docx.py"], 0],
    [["docx-render","render_docx.py"], 0],
    [["excel-edit","edit_excel.py"], 0],
    [["excel-read","read_excel.py"], 0],
    [["excel-recalc","recalc_excel.py"], 0],
    [["excel-render","render_excel.py"], 0],
    [["excel-vba-edit","edit_vba.py"], 0],
    [["excel-vba-read","read_vba.py"], 0],
    [["pdf-tools","create_pdf.py"], 0],
    [["pdf-tools","read_pdf.py"], 0],
    [["pdf-tools","render_pdf_pages.py"], 0],
    [["pptx-create","build_template_16x9.py"], 0],
    [["pptx-create","create_pptx.py"], 0],
    [["pptx-edit","edit_pptx.py"], 0],
    [["pptx-inspect","inspect_pptx.py"], 0],
    [["pptx-read","read_pptx.py"], 0],
