# ============================================================================
# Locohane 設定ファイル
#
# すべての接続先・保存先パスをこの1ファイルに集約する（透明性最優先）。
# 各値は環境変数で上書き可能（対応する環境変数名は src/config.py を参照）。
# ============================================================================

[llm]
# llama.cpp server（llama-server）の OpenAI 互換エンドポイント。
# 例: llama-server --host 127.0.0.1 --port 8080  →  http://localhost:8080/v1
base_url = http://localhost:12430/v1
# llama.cpp は認証不要のためダミー値でよい（空だとクライアントが弾くため何か入れる）。
api_key = dummy-not-used
# モデル名は llama-server の --model / --alias に合わせて切り替える。
model = QWEN3.6_35B-A3B
# 生成のばらつき（0.0〜）。ツール呼び出しの安定性を優先し低めに設定
# （変更経緯は evals/tuning_log.md 参照）。
temperature = 0.6
# 累積確率上位のみサンプリングする閾値（0〜1）。空欄なら未指定（llama-server既定に委ねる）。
top_p = 0.95
# 上位k候補のみサンプリングする（llama.cpp拡張、OpenAI標準APIには無い）。空欄なら未指定。
top_k = 20
# 直近生成トークンの再出現を抑制する係数（llama.cpp拡張、1.0=無効、1.1前後で軽く抑制）。
# 空欄なら未指定。thinking（<think>ブロック）内で同じ文言を繰り返すループの抑制に
# 直接効くが、ファイルパス等の反復文字列の生成精度とトレードオフの関係にあるため、
# ループ抑制自体は thinking_loop_guard（アプリ側の検知+リトライ）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
repeat_penalty = 1.0
# 出現済みトークン全体への一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
frequency_penalty = 0
# 一度でも出現したトークンへの一律ペナルティ（OpenAI標準API、0.0=無効）。空欄なら未指定。
presence_penalty = 0
# 1リクエストあたりの最大生成トークン数。空欄なら無制限（llama-server既定に委ねる）。
# thinkingの暴走で応答が返らなくなるケースの歯止めにもなる。
max_tokens = 128000
# --- DRY (Don't Repeat Yourself) サンプラー（llama.cpp拡張） ---
# repeat_penalty より長いフレーズ単位の反復（thinking内で同じ文を繰り返す等）に
# 強く効く。0.0 または空欄で無効。ファイルパス等の反復文字列の生成精度との
# トレードオフがあるため、暴走対策は[thinking_loop_guard]（アプリ側の検知+
# リトライ）と[llm].max_tokens=128000（最終的な歯止め）に委ねている
# （変更経緯は evals/tuning_log.md 参照）。
dry_multiplier =
# 反復長に対するペナルティの指数増加率（既定 1.75 相当）。空欄なら未指定。
dry_base =
# この文字数以下の反復は許容する（既定 2 相当）。空欄なら未指定。
dry_allowed_length = 
# 反復検出に遡って見るトークン数（-1 でコンテキスト全体、既定 -1 相当）。空欄なら未指定。
dry_penalty_last_n = 
# 反復検出をリセットする区切り文字（カンマ区切りで複数指定、例: 改行,:,",*）。
# 空欄なら llama-server 既定（改行・:・"・*）に委ねる。
dry_sequence_breakers =
# トークン使用量（入力/出力/合計）を取得するかどうか。true にすると
# ChatOpenAI の stream_usage=True が有効化され、Chainlit UI とeval結果に
# トークン数が表示される。llama-server が stream_options.include_usage
# 拡張に未対応でエラーになる場合のみ false にする。
track_token_usage = true
# LLMサーバーへの応答待ちタイムアウト秒数（read/write/pool。connectは別途
# 固定10秒）。read timeoutはチャンク間のアイドル時間の上限で、生成が続く
# 限りチャンク到達のたびにリセットされるため、正常な長時間ストリーミングは
# 妨げない。ストリームの後始末失敗等でクライアントが壊れたまま次のリクエスト
# がハングし続ける異常事態を検知するための値（変更経緯は evals/tuning_log.md
# 参照）。
request_timeout_seconds = 300
# ストリーミング中にチャンクが一定時間届かない場合のタイムアウト秒数
# (langchain_openaiのstream_chunk_timeout)。request_timeout_secondsとは別物で、
# 「チャンクとチャンクの間隔」の上限。大きなコンテキストのプロンプト処理
# (prefill)に時間がかかる環境(CPU/GPU性能が低い、n-cpu-moeでCPUオフロード
# している等)では、生成開始までにこの秒数を超えてタイムアウトしやすい。
# ライブラリ既定値は120秒。
#
# P4 切り分け実験: この値を 0 に設定すると、langchain_openai 内の
# _astream_with_chunk_timeout で wait_for が無効化され、チャンク単位の
# asyncio.Task 生成（別タスク化）が止まる。これにより 2026-07-28 incident
# で確認された "Attempted to exit cancel scope in a different task" 等の
# RuntimeError が再現しなくなるか確認できる。request_timeout_seconds
# （P0-1 で実効化済み）が read timeout を担保するため、0 でも安全性は
# 損なわれない。実験終了後は元の値（300）へ戻す。
stream_chunk_timeout_seconds = 300

[paths]
# スキル定義フォルダ（ここ配下の各サブフォルダの SKILL.md を起動時に走査する）。
skills_dir = ./skills
# エージェント種別定義フォルダ（skills_dir と同格。ClaudeCode の .claude/agents/*.md
# 相当）。ここ配下の各 *.md を dispatch_agent の agent_type 種別として起動時に走査する。
# 1ファイル = 1種別。frontmatterで name/description/tools を指定する
# （tools 省略時は既定のツール一式を継承する）。
agents_dir = ./agents
# プロジェクト固有の拡張ディレクトリ（ClaudeCode の .claude/ 相当）。
# 指定した各ディレクトリ配下の以下3つを起動時に自動検知する（いずれも存在しなくても
# エラーにはならない）:
#   skills/      - skills_dir に追加でマージ走査される追加スキル（同名スキルが
#                  両方に存在する場合はこちら側が優先される）
#   agents/      - agents_dir に追加でマージ走査される追加エージェント種別
#                  （同名定義が両方に存在する場合はこちら側が優先される）
#   LOCOHANE.md  - システムプロンプトの {{project_instructions}} へ差し込まれる
#                  プロジェクト固有の追加指示（ClaudeCode の CLAUDE.md 相当）。
#                  存在しなくてもエラーにはならない（「（プロジェクト固有の指示は
#                  ありません）」が差し込まれるだけ）。1ファイルあたり200行を
#                  超える場合は切り詰められる。
# 複数ディレクトリを指定したい場合は、[thinking_loop_guard].nudge_messages と同じ
# JSON/Python風リスト形式（角カッコ＋改行複数行OK）で指定する。指定順で後方の
# ディレクトリが優先される（skills/agents はマージ、LOCOHANE.mdは見出し付きで
# 連結。マージ・重複排除等は行わない）。例:
# project_locohane_dir = [
#     "./.locohane",
#     "./.locohane_team",
#     ]
project_locohane_dir = [
    "./.locohane",
    "./.officecli"
    ]
# run_script/execute_python_code のサブプロセスへ渡す PATH の先頭に追加する
# ディレクトリ（外部バイナリ実行ファイルの配置先）。officecli-xlsx等のスキルは
# コマンド名（`officecli ...`）を素の状態で叩く前提のため、OS側のPATH環境変数へ
# ユーザーが手動登録していないと「コマンドが見つからない」で失敗する。ここに
# 配置先を明示しておけば、evals・app.py実行時のどちらでも手動登録なしで
# 呼び出せる（src/tools.py の _subprocess_env 参照）。project_locohane_dir と
# 同じJSON/Python風リスト形式で指定する。存在しないディレクトリは無視される。
bin_path = [
    "./.officecli/bin"
    ]
# システムプロンプトのテンプレートファイル（{{skills}} にスキル一覧を差し込む）。
system_prompt_path = ./system_prompt/system_prompt.md
# LangGraph の会話状態（チェックポイント）を溜める SQLite ファイル。
checkpoint_db = ./data/checkpoints.sqlite
# Chainlit へのアップロードファイルの保存先。
upload_dir = ./data/uploads
# アプリログの出力先ディレクトリ。
log_dir = ./data/logs
# ログの詳細度。次の3値のいずれか:
#   info  - 現行仕様。各ツール呼び出しの概要（ツール名・要約引数）のみ記録する。
#   debug - info に加えて、ツール呼び出しの全引数・全結果、LLMの応答本文・
#           thinking（reasoning_content）まで記録する（情報量・ファイルサイズが
#           大きく増える。障害調査でモデルの挙動を忠実に追いたいときに使う）。
#   none  - ログ出力を一切行わない（data/logs/app_*.log を含め何も生成しない）。
log_level = debug
# 起動のたびに新しい app_*.log ファイルを作成するか、直近の既存ファイルに
# 追記を試みるか（true/false）。
# false（既定）: 直近の app_*.log への追記を試みる（既に [log].max_lines を
#                超えていれば、その場で新しいファイルにローテーションする）。
# true          : 起動のたびに必ず新しい日時つきファイルを作成する。
# log_level=none のときはログ自体を出さないため、このフラグは意味を持たない。
log_clear_on_startup = true
# エージェントの既定の作業ディレクトリ（run_script の cwd、スクリプトが生成する
# ファイルの出力先の基準になる）。Chainlit の ChatSettings（歯車アイコン）で
# セッション単位の作業ディレクトリが指定されなかった場合に使われる。
default_workdir = ./data/temp
# 永続メモリーの保存先（user/feedback/project/reference のサブフォルダと MEMORY.md 索引を持つ）。
memory_dir = ./data/memory
# help ツールが読み込んで返すヘルプ本文（ユーザー向け、Markdown）。
help_path = ./system_prompt/help.md

[uploads]
# アップロードファイルの保持日数。この日数を過ぎた（更新日時が古い）ファイルは自動削除する。
# 0 以下を指定すると自動削除を無効化する。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[images]
# 画像をLLMへ渡す前に縮小する際の、長辺のピクセル数の上限
# （analyze_image ツールと、ユーザーがアップロードした画像の両方に効く）。
# 「DPI」ではなく長辺ピクセル数で指定しているのは、スマホ撮影のJPEGはDPI
# メタデータを持たない/当てにならない一方、Visionモデルが消費するトークン量は
# 画素数でほぼ決まるため。値を下げるほど1回のサブエージェント委任で扱える
# 枚数が増えるが、写真に写り込んだ細かい文字は読み取りにくくなる。
# 0 を指定すると縮小しない（元の解像度をそのまま送る）。
# 画像の長辺が既にこの値以下の場合は再エンコードせず元データをそのまま使う。
max_long_side_pixels = 2048
# 縮小後に再エンコードするJPEGの品質(1-95)。文字が写り込んだ画像を読み取らせる
# 用途では下げすぎると判読できなくなるので85以上を推奨。
jpeg_quality = 85

[default_workdir]
# default_workdir（[paths]セクション）直下に溜まり続けるファイルの保持日数。
# この日数を過ぎた（更新日時が古い）ファイルは自動削除する。0 以下を指定すると
# 自動削除を無効化する。ユーザーが ChatSettings で指定したセッション単位の
# work_dir は対象外（default_workdir のみが対象）。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[path_memory]
# パスメモリー（src/path_memory.py）が会話ごとのレジストリファイル
# （<thread_id>.json）を保存するディレクトリ。
dir = ./data/path_memory
# 保持日数。この日数を過ぎた（更新日時が古い）レジストリファイルは自動削除する。
# 「会話終了」を明示的に検知する手段が無いため、日数ベースで管理する。
retention_days = 1
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1
# 1会話あたりの登録上限件数。
max_entries = 10000

[log]
# app_*.log（[paths].log_dir に出力されるアプリログ）1ファイルあたりの
# 最大行数。この行数を超えたら、新しい日時つきファイル名
# （例: app_20260725_14.log。分・秒は含めない）へローテーションする。
# ファイル名の日時はローテーションのたびに「今」の日時で付け直す
# （起動時刻固定ではない）。同一時間帯（同じ年月日時）に複数回ローテーション
# する場合は _1, _2... の連番を付けて衝突を避ける。
# 1レコード（例外トレースバック等）が複数行になる場合はその全行をカウント
# するため、閾値は「ファイルの実際の行数」を指す。log_level=none のときは
# app_*.log自体を生成しないため意味を持たない。
max_lines = 5000
# ローテーションで増え続ける古い app_*.log の保持日数。この日数を過ぎた
# （更新日時が古い）ファイルは自動削除する。0 以下を指定すると自動削除を
# 無効化する。同じ log_dir に evals/run_case.py が書き出す evals.log は
# 別扱いのため削除対象に含まれない。
retention_days = 7
# 自動削除チェックの実行間隔（時間）。起動時にも1回チェックを実行する。
cleanup_interval_hours = 1

[chat_log]
# 会話ログ（ユーザー発言とAIの最終応答）をテキストファイルへ記録する機能の有効/無効。
# false（既定）: 記録しない。
enabled = true
# 会話ログの保存先ルートディレクトリ。<dir>/<ユーザー名>/<日付>_<thread_id>.log の
# 構成で書き出す。ユーザー名はログイン中のユーザー識別子（[auth] enabled=false の
# 場合は "anonymous" にまとめる）。
dir = ./data/logs_chat

[scripts]
# run_script ツール・execute_python_code ツール共通の実行設定。
# 実行タイムアウト秒数（run_script / execute_python_code 共通）。
timeout = 300
# .py スクリプトを起動する Python 実行ファイル（run_script / execute_python_code 共通）。
python = C:/DT_Python/Python311/env_claudecode/Scripts/python.exe
# execute_python_code ツール（LLMが生成したPythonコードをその場で実行する）の有効/無効。
# false にすると、ツール自体は呼び出されてもエラーを返すだけになり、コードは実行されない。
code_execution_enabled = true
# ここから run_script_background（バックグラウンド実行版）専用の設定。
# バックグラウンドジョブを強制終了するまでの上限秒数（timeout とは別軸。
# 同期版 run_script より長時間の実行を想定した上限）。
background_max_runtime_seconds = 3600
# ジョブが完了・失敗・タイムアウト等で終了した後、check_script_job で一度も
# 取得されないまま残ってよい秒数。超過分は次回の run_script_background 呼び出し
# 時に破棄される。
background_job_retention_seconds = 1800

[file_tools_duplicate_guard]
# Read/Glob/Grep/json_query ツールを同一引数で繰り返し呼び出すのを防ぐ
# ガード機能の設定。これらは読み取り専用のため、同一引数での再実行は
# 結果が変わらないと保証できることを利用している（小型ローカルモデルが進捗の
# 無いまま同じ呼び出しを会話全体を通じて散発的に繰り返す事例への対策。
# src/tools.py の _check_file_tools_duplicate / _record_and_check_duplicate 参照）。
enabled = true
# 同一シグネチャ（ツール名+引数）の呼び出しを何回まで許可するか
# （この回数に達した以降の呼び出しをエラーで拒否する）。既定は1回
# （＝初回のみ許可し、2回目以降は拒否）。
max_calls = 3
# サブエージェント（dispatch_agent）内での呼び出し履歴を、メインエージェントの
# 判定へ持ち越すかどうか。
#   true　　　　  : メインエージェントとサブエージェントで呼び出し集合を共有する。
#                   例えばサブエージェントが読んだファイルを、その後メイン
#                   エージェントが同じ引数で読もうとしても重複として拒否される。
#   false         : メインエージェントとサブエージェントの呼び出し履歴を別々に
#                   管理する。サブエージェント内の呼び出しはメインエージェント側の
#                   判定に影響しなくなる（逆にメインエージェントの呼び出し履歴も
#                   サブエージェント側の判定には影響しない）。
carry_over_to_main = false

[graph]
# ReAct ループの実装切替。
#   "handwritten" : 手書き StateGraph（agent/tools ノードを自前配線。挙動を追いやすい）
#   "prebuilt"    : LangGraph 標準の create_react_agent（実装は最小だが内部は隠蔽される）
implementation = prebuilt
# メインの ReAct ループ（agent→tools 遷移）の最大反復回数。LangGraph の
# recursion_limit にそのまま渡す。超過時は GraphRecursionError を app.py 側で
# 捕捉し、ユーザーに打ち切りメッセージを表示する。
# 単位はノード遷移数（agent/tools 各1ステップ）で、[subagent] max_iterations
# （agent↔tools 往復回数）とは数え方が異なる点に注意。
recursion_limit = 500

# --- 並列数ガード ---
# メインエージェントのツール呼び出し（ImageAwareToolNode 経由）を、同時に
# 何件まで並列実行してよいか。LangGraph の ToolNode は同一AIMessage内の
# 複数tool_callsを asyncio.gather() で完全並列実行するため、モデルが1ターンで
# 複数ツールを呼ぶと、呼び出し順とレスポンス処理順が食い違ったり、共有リソース
# （llama-server・DB等）への同時アクセスが起きうる（[subagent] max_parallel と
# 同じ理由づけのメインエージェント版）。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする
#   （既定は1＝完全直列化。呼び出し順序も asyncio.Semaphore のFIFOキューにより
#   ある程度保たれる）。
# 0以下: ガードを無効化し、並列呼び出しをそのまま許可する。
max_parallel = 1

# --- メインエージェントのトークンガード ---
# メインエージェントの直近1回のLLM応答の total_tokens が閾値に達したら、次の
# モデル呼び出しの入力へ handoff_prompt_path の文言を差し込み、「ユーザーへの
# 状況報告」と「新しいチャットで再開するための引継ぎプロンプト」を出力させて
# 安全に終える（src/main_token_guard.py 参照）。サブエージェント側の
# [subagent].token_guard_* のメインエージェント版。LLM自身は自分のトークン
# 使用量を認識できないため、コード側で判定する。track_token_usage=false の
# 場合は usage_metadata が取得できず実質発火しない。
token_guard_enabled = true
# 低パラメータモデルでは1リクエストあたりのトークン数が一定を超えると処理を
# 続けられなくなる。その実効上限（例: 64000）から、ツール結果1往復ぶんの
# 増加量の余裕を引いた値にすること。
# （実測: この仕組みが無い状態では1リクエストあたり24,833→128,000まで単調に
# 増加し、コンテキスト上限に張り付いて処理が停止した）
token_guard_soft_threshold = 49152
# 上記で差し込む文言（新しいチャットへの引継ぎ手順）のMarkdownファイル。
handoff_prompt_path = ./system_prompt/handoff_prompt.md

[subagent]
# dispatch_agent ツールが内部で回す ReAct ループの最大反復回数（agent→tools 遷移の回数）。
# 超過した場合は打ち切り、その時点までに集められたツール結果を要約して返す
# （変更経緯は evals/tuning_log.md 参照）。
#
# この値は system_prompt.md から ${subagent_max_iterations} として参照され、
# 「1回の dispatch_agent に渡すファイル件数の目安（バッチサイズ）」としても使う。
# 本来の意味（反復回数）とは別用途だが、プロンプト側に根拠の無い数値を直書きする
# のを避けるため、出典をこの1箇所に集約している。
# 補足: サブエージェントは複数のツール呼び出しを同一ターンで並列発行するため、
# 実測では反復回数は2回程度で頭打ちになり、この値が反復側の制約になることは
# ほぼ無い。実質的な上限は下の token_guard_* 側である。したがってバッチサイズを
# 増減したい場合、この値を変えるだけでは足りず token_guard_* も併せて見ること。
max_iterations = 30

# --- 並列数ガード ---
# dispatch_agent ツールの実LLM呼び出しを、同時に何件まで許可するか。
# モデルが1ターンで dispatch_agent を複数回呼ぶと、ToolNode の仕様上それらは
# 並列実行される。バックエンドが単一インスタンスの llama-server の場合、
# --parallel で設定したスロット数を超えて並列に複数リクエストが飛ぶと、
# AIMessage の tool_calls に対応する ToolMessage が欠落してチェックポイントが
# 破損し、次のモデル呼び出しで LangGraph が ValueError を送出する不具合が
# 本番で確認されたため導入（src/tools.py の _DISPATCH_AGENT_SEMAPHORE）。
# 1以上: asyncio.Semaphore(N) で同時実行数をその値までにガードする。
#   運用中の llama-server の --parallel 値と揃えるのが安全（既定は1＝完全直列化）。
# 0以下: ガードを無効化し、dispatch_agent の並列呼び出しをそのまま許可する
#   （複数llama-serverインスタンス等での検証用）。
max_parallel = 1

# --- トークン使用量ガード ---
# dispatch_agent 内のLLM応答1回分の usage_metadata.total_tokens を監視し、
# 閾値超過時に「注意喚起（ソフト）→打ち切り（ハード）」の二段階制御を行う。
# LLM自身は自分のトークン使用量を認識できないため、コード側（src/subagent.py）
# で判定する。track_token_usage=false の場合は usage_metadata が取得できず
# 実質発火しない。
token_guard_enabled = true
# 直近1回の応答の total_tokens がこの値以上になったら、そのiterationの
# tool_callsは通常通り実行した上で、次のモデル呼び出し前に「まとめて回答せよ」
# という注意メッセージを1回だけ注入する。[llm].max_tokens（絶対的なモデル側の
# 上限）や[context_compaction].token_threshold（メイングラフ全体の圧縮閾値）
# より小さめの水準にすること。
token_guard_soft_threshold = 32000
# ソフト警告後もなお total_tokens がこの値以上の応答が続いた場合、その
# tool_callsは実行せず、それ以上model.ainvoke()を呼ばずに打ち切る
# （max_iterations到達時と同じ要約フォーマットで返す）。ソフト警告注入後の
# 「次の1応答」分のバッファを見込み、token_guard_soft_thresholdより余裕を
# 持たせた値にすること。[context_compaction].token_threshold（メイングラフ
# 全体の圧縮閾値）を下回る水準にすることで、メイングラフ側の圧縮閾値に
# 達するより先にサブエージェント側で自律的に収束させる狙い。
token_guard_hard_threshold = 64000

# --- 空応答ガード ---
# dispatch_agent内のLLM応答が tool_calls も本文も空（LLMサーバー側の異常
# 応答）だった場合、これを正常終了とみなして空文字列を返してしまうと、
# それまでの調査結果が丸ごと握りつぶされて委譲元に何も伝わらない
# （本番incident・2026-07-23参照）。この回数まで再試行し、それでも空の
# 応答が続く場合のみ、それまでに集めたツール実行結果を要約して打ち切る。
empty_response_max_retries = 2

[timeouts]
# ユーザーの応答待ち（Chainlit の cl.AskActionMessage/cl.AskUserMessage）の
# タイムアウト秒数。いずれも未応答の場合は安全側に倒す（承認系はタイムアウト、
# 質問系はエラー扱い）。[scripts].timeout（スクリプト/コード自体の実行タイムアウト）
# とは別物。
# create_plan で作った計画への承認（approve_plan）の待ち時間
# （変更経緯は evals/tuning_log.md 参照）。0 を指定すると無期限待ちになる。
approval_seconds = 0
# AskUserQuestion（自由記述の質問。labels省略時は単発質問、labels指定時は
# 複数項目フォーム）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_question_seconds = 0
# ask_user_choice（選択肢形式の質問）の待ち時間。0 を指定すると無期限待ちになる。
ask_user_choice_seconds = 0

[plan]
# 送信ボタン付近に表示する Plan Mode / Edit Automatically バッジを
# クリックしたときの挙動。
# true : 双方向切り替え可能（Plan Mode → Edit Automatically も含む）。
#        approve_plan によるユーザー承認プロセスを経ずに、クリック一発で
#        書き込み系ツールのロックを解除できる。
# false: Edit Automatically → Plan Mode への一方向のみ許可（ロックする
#        方向のクリックのみ有効）。Plan Mode → Edit Automatically への
#        解除はバッジのクリックでは行えず、必ず approve_plan（LLM経由の
#        ユーザー承認フロー）を通す必要がある。双方向切り替えで弊害が
#        出た場合の安全弁として false に変更する。
allow_badge_unlock = true

[thinking_loop_guard]
# LLM応答（thinking/本文）のストリーミング中に反復ループ（同一の文・コード
# ブロックがほぼそのまま繰り返される暴走）を検知したら、生成を打ち切って
# 注意メッセージを注入し再試行する機能の設定。[llm].dry_multiplier（サーバー側
# のDRYサンプラー）で大幅に抑制されるが、完全には無くならない残存リスクへの
# アプリ側（クライアント側）の安全網。
enabled = true
# 判定対象とする直近テキストのウィンドウ文字数。
window_chars = 600
# このバイト数増えるごとに再チェックする。
check_interval_chars = 150
# 上記条件が連続で何回成立したら確定でループと判定するか（誤検知防止）。
confirm_count = 2
# 周期に依存しない反復検知。直近window_chars文字が、それより前の履歴
# （最大max_history_chars文字に制限）の中にどれだけ長く一致する部分文字列を
# 持つかを、difflib.SequenceMatcher.find_longest_match()で動的に測定する。
# 比較対象とする過去履歴の上限文字数。大きいほど長い周期の反復も検知できるが
# 計算コストが増える（変更経緯は evals/tuning_log.md 参照）。
max_history_chars = 4000
# match_ratio（直近ウィンドウとの最長一致長/window_chars）がこの値を
# 上回ったら「反復的」の候補とみなす（変更経緯は evals/tuning_log.md 参照）。
match_ratio_threshold = 0.4
# ループ検知後、注意メッセージを注入して再試行する最大回数
# （メイングラフ・サブエージェントで共通）。
# 下の empty_response_max_retries とは独立に消費される（src/graph.py の
# ainvoke_ensuring_final_text 参照）。大量ファイル処理のように1ターンで
# LLM呼び出しが数十〜数百回に及ぶタスクでは、序盤と終盤で独立した失敗が
# 起きうるため、少し余裕を持たせている（変更経緯は evals/tuning_log.md iter41）。
max_retries = 3
# ループ検知後に注入する注意メッセージ（JSON/Python風のリスト（配列）形式で指定）。
# リトライ1回目には1つ目、2回目には2つ目…の順で使う。用意した数より
# リトライ回数が多い場合は、以降はランダムに選ぶ（同じ文言の繰り返しで
# 同じ堂々巡りを誘発しないため）。空リスト[]なら組み込みの既定文言を使う。
nudge_messages = [
    "直前の応答は同じ内容を繰り返すループに陥ったため打ち切りました。落ち着いて、今のタスクの続きを行ってください。",
    "同じ検討が繰り返されています。新しいアプローチを探す必要はありません。すでに分かっている手順のうち、まだ実行していない次の1ステップだけを、今すぐツール呼び出しとして実行してください。考え直さず手を動かしてください。",
    "ループが3回目に達しました。これ以上同じ失敗を繰り返すと処理が強制終了されます。今すぐ手を止め、これまでの失敗の原因を一文で明確にした上で、その原因を確実に回避する具体的な一手だけを実行してください。",
    ]
# 無言終了（tool_calls も本文も空のAIMessage）を検知した場合に、最終回答を
# 促して再試行する最大回数（メイングラフ・evalハーネスで共通。旧実装は
# app.py内にハードコードされていたが、上のmax_retriesと対になる兄弟設定の
# ためここに置く）。上の max_retries とは独立に消費される（全体の試行回数は
# 両者の合計+1が上限）。ローカルモデルはツール呼び出しのXMLを本文へ書いて
# しまい空応答になることが散発的にあり、再試行すれば直ることが多いため
# （変更経緯は evals/tuning_log.md iter41）。
# 実測（2026-08-01、100枚レシピケース）で、create_plan/approve_plan/
# update_task_progress のような状態確認だけのツール結果の直後に空応答が
# 立て続けに3回発生し、後半の実作業まで進んだ時点で予算切れとなって最終回答が
# 空のまま終わった事例があった。1回あたりのコストは低い（空応答からの
# リトライは即座に完了する）ため、序盤の消費に余裕を持たせる目的で増量した。
empty_response_max_retries = 5

[context_trim]
# 長いReActループ（ファイル読み込み等のツール呼び出しを繰り返すタスク）で、
# サイズ上限のないツール実行結果（例: OCR結果のMarkdown全文）が ToolMessage
# としてそのまま会話履歴に蓄積し続け、llama.cppへのプロンプトプリフィルが
# 極端に遅くなる問題への対策。直近の ToolMessage 以外は content を切り詰めて
# LLMへの入力だけを絞り込む（会話履歴自体は書き換えない。src/context_trim.py
# 参照。変更経緯は evals/tuning_log.md 参照）。
enabled = true
# 全文保持する直近 ToolMessage の件数。これより古い ToolMessage のみ切り詰め対象。
keep_recent_tool_messages = 5
# 切り詰め対象 ToolMessage / AIMessage の content を、先頭何文字まで残すか
# （超過分はマーカー文言に置換）。
truncated_max_chars = 2000
# ToolMessage だけでなく AIMessage（モデル自身の思考本文と tool_calls の引数）も
# 切り詰めるか。execute_python_code の code 引数へファイル本文を書き写すような
# 使い方をすると、ToolMessage 側だけを絞っても1リクエストあたりの入力が膨らみ
# 続けてコンテキスト上限に張り付くため、既定で有効
# （変更経緯は evals/tuning_log.md 参照）。tool_calls の id/name と件数は
# 変更しないため、ToolMessage との対応関係は壊れない。
trim_ai_messages = true
# 全文保持する直近 AIMessage の件数。これより古い AIMessage のみ切り詰め対象。
keep_recent_ai_messages = 3

[context_compaction]
# ClaudeCodeのcompact相当。リクエスト（LLM呼び出し）1回あたりのトークン数が
# token_threshold を超えたら、古い会話履歴をLLM自身に要約させ、永続履歴
# （checkpointer上のメッセージ）自体を圧縮する（src/context_compaction.py 参照）。
# [context_trim]は「今回の入力だけを縮める・永続履歴は書き換えない」方針だが、
# こちらは永続履歴自体を縮めるため、会話が長引くほど効くプリフィル遅延・
# トークン量への恒久対策になる。
# この機能はメインエージェントのみに適用され、サブエージェントは適用されない。
enabled = true
# 直近1回のLLM呼び出しの total_tokens がこの値を超えたら圧縮する。
# 低パラメータモデルでは1リクエストあたり64000未満に収める必要があるため、
# ツール結果1往復分の余裕を見てそれより低い値にすること。
token_threshold = 49152
# 圧縮時に丸ごと保持する直近のユーザーターン数。
# 構造ベース（発行済み tool_call id と返却済み ToolMessage id の一致）で
# 安全な切断点を探し、その位置で古い側を要約対象として切り離す。
keep_recent_turns = 2
# 会話全体のメッセージ数がこの件数未満なら、閾値を超えていても圧縮しない
# （短い会話で無駄に要約を走らせない安全弁）。
min_messages_to_compact = 10
# 要約を指示するプロンプト本文（Markdown）のパス。
compaction_prompt_path = ./system_prompt/compaction_prompt.md

[auth]
# ログイン認証機能のON/OFF。
# false（既定）: ログイン不要（現状通り、誰でもそのまま使える）。
# true          : 起動時にログイン画面が表示され、.env の AUTH_USERS に登録した
#                 ユーザー名/パスワードでのログインが必須になる。
# ユーザー名・パスワードの実体、および必須の CHAINLIT_AUTH_SECRET は
# .env（環境変数）側で管理する（機密情報は config.ini に置かない方針のため、
# ここには ON/OFF フラグのみを置く。詳細は .env.example / README.md 参照）。
enabled = false
# enabled=true のときのパスワード必須/不要の切り替え。
# true（既定） : ユーザー名とパスワードの両方が .env の AUTH_USERS の登録内容と
#                完全一致しないとログインできない。
# false        : ユーザー名さえ AUTH_USERS に登録済みであれば、パスワードは
#                何を入力しても（空でも）ログインできる。社内LAN等、ネットワーク
#                到達性自体で十分に閉じており、ユーザー名だけで作業者を区別・
#                記録できれば足りる環境向けの緩和スイッチ。
require_password = false

[checkpointer]
# LangGraphの会話状態を永続化するSQLite接続（aiosqlite、[paths].checkpoint_db）
# 周りのタイムアウト設定。DB接続切れエラー（issue.md「DB接続切れエラー
# （no active connection）」参照）の対策として導入。
# checkpointer操作（aget_tuple/aput_writes等）1回あたりのタイムアウト秒数。
# aiosqliteのバックグラウンドスレッドが固着すると内部ロックが永久に解放
# されず全操作がハングするため、この秒数で切り上げて _CheckpointerTimeout
# を送出し、checkpointer再構築（下記2値も参照）へフォールバックする
# （app.py の _TimeoutGuardedSqliteSaver._guarded 参照）。
op_timeout_seconds = 15
# checkpointer再構築時、旧DB接続をクローズする際のタイムアウト秒数。
# 旧接続のクローズが固着しても新接続への切り替え自体はブロックしない
# （超過時はログのみでリークを許容する。app.py の _rebuild_checkpointer 参照）。
close_timeout_seconds = 3
# アプリシャットダウン時、保留中の非同期タスク（on_messageのストリーム処理等）
# の完了を待つ最大秒数。この秒数を過ぎてもなお残っているタスクはキャンセル
# してから後始末の完了を待ち、その後にDB接続を閉じる。先に接続を閉じてしまうと
# 保留タスクのcheckpointer操作が ValueError: no active connection で失敗する
# ため、必ずこの順序を守る（app.py の _close_checkpointer_gracefully 参照）。
shutdown_drain_timeout_seconds = 5

[mcp]
# .locohane/settings.json の mcpServers に定義された全MCPサーバーへの
# 自動接続機能そのものの有効/無効。false ならファイルの有無に関わらず
# 一切接続しない（.locohane/settings.json の "mcp"."enabled" があればそちらが
# 優先。ここは settings.json に指定が無い場合のデフォルト値）。
enabled = true
# .locohane/settings.json のパス（相対パスはプロジェクトルート基準）。
# Claude Code / Qwen Code の mcpServers 設定形式を参考にした、stdioトランスポート
# 専用のMCPサーバー接続設定ファイル（src/mcp_client.py 参照）。
settings_path = ./.locohane/settings.json
# 1サーバーあたりの起動（プロセス起動 + initialize + tools/list）のタイムアウト
# 秒数。超過したサーバーは接続失敗として扱いスキップする（アプリ起動は継続する）。
connect_timeout_seconds = 15
# MCPツール（tools/call）1回あたりのタイムアウト秒数。
call_timeout_seconds = 60
